function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function randomSet(){
  // format penuh: 30 Part A, 2 percakapan Part B, 3 ceramah Part C, 15 Structure, 25 Written Expression, 5 bacaan
  const grp=part=>shuffle(Object.keys(LGROUPS).filter(k=>LGROUPS[k].part===part));
  const A=shuffle(Q.filter(q=>q.sec==='L'&&!q.g)).slice(0,30);
  const B=grp('B').slice(0,2).flatMap(k=>Q.filter(q=>q.g===k));
  const C=grp('C').slice(0,3).flatMap(k=>Q.filter(q=>q.g===k));
  const S=shuffle(Q.filter(q=>q.sec==='S')).slice(0,15);
  const W=shuffle(Q.filter(q=>q.sec==='W')).slice(0,25);
  const R=shuffle(Object.keys(PASSAGES)).slice(0,5).flatMap(p=>Q.filter(q=>q.p===p));
  return [...A,...B,...C,...S,...W,...R].map(q=>q.id);
}
function packSet(pack,secs){
  if(pack==='x'){return randomSet().filter(id=>secs.includes(byId(id).sec))}
  return Q.filter(q=>q.pack===pack&&secs.includes(q.sec)).map(q=>q.id);
}

let st=null, tick=null, playing=false, confirmEnd=false, revFilter='wrong';

function startTest(mode,ids,label){
  stopAudio();playing=false;clearInterval(tick);confirmEnd=false;
  st={mode,ids,label,cur:0,ans:{},plays:{},flags:{},start:Date.now(),done:false,used:0};
  if(mode==='sim'){
    st.secs=SECTIONS.map(S=>({...S,ids:ids.filter(id=>bucket(byId(id))===S.k)})).filter(S=>S.ids.length);
    st.si=0;st.phase='intro';renderIntro();
  }else{st.phase='test';tick=setInterval(updTimer,1000);renderTest()}
  window.scrollTo(0,0);
}
function simActive(){return st&&st.mode==='sim'&&!st.done}
function secRange(){const ids=st.secs[st.si].ids;return [st.ids.indexOf(ids[0]),st.ids.indexOf(ids[ids.length-1])]}
function secLimit(){return st.secs[st.si].min*60}
function remaining(){return secLimit()-Math.floor((Date.now()-st.secStart)/1000)}
function beginSection(){
  st.phase='test';st.secStart=Date.now();st.cur=secRange()[0];confirmEnd=false;
  clearInterval(tick);tick=setInterval(()=>{updTimer();if(simActive()&&st.phase==='test'&&remaining()<=0)endSection(true)},1000);
  renderTest();window.scrollTo(0,0);
}
function endSection(timeout){
  stopAudio();playing=false;clearInterval(tick);confirmEnd=false;
  st.used+=Math.min(secLimit(),Math.floor((Date.now()-st.secStart)/1000));
  if(st.si<st.secs.length-1){st.si++;st.phase='intro';st.timedOut=!!timeout;renderIntro();window.scrollTo(0,0)}
  else finish();
}

function fmtTime(s){s=Math.max(0,s);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function updTimer(){const el=document.getElementById('timer');if(!el||!st)return;
  if(st.done){el.textContent=fmtTime(st.result.used);el.classList.remove('low');return}
  if(st.mode==='sim'){const r=remaining();el.textContent=fmtTime(r);el.classList.toggle('low',r<=300)}
  else el.textContent=fmtTime(Math.floor((Date.now()-st.start)/1000));}

  const state=my===undefined?'na':ok?'ok':'no';
  let h=`<div class="feedback ${state}">
    <strong>${my===undefined?'Tidak dijawab':ok?'Benar':'Kurang tepat'} · Kunci ${L4[q.a]}${q.sec==='W'?` · bagian "${opts[q.a]}"`:''}</strong>`;
  if(my!==undefined&&!ok)h+=`<div class="why no"><span class="label">Kenapa ${L4[my]} salah</span><p>${wrongNote(q,my)}</p></div>`;
  h+=`<div class="why ok"><span class="label">${ok?'Pembahasan':`Kenapa ${L4[q.a]} benar`}</span><p>${q.ex}</p></div>`;
  if(!ok){
    const others=[0,1,2,3].filter(k=>k!==q.a&&k!==my);
    h+=`<details class="others"><summary>Lihat alasan pilihan lainnya</summary><ul>${others.map(k=>`<li><b class="mono">${L4[k]}</b> ${q.sec==='W'?`"${opts[k]}"`:opts[k]} — ${wrongNote(q,k)}</li>`).join('')}</ul></details>`;
  }
  h+=`</div>`;
  if(tip)h+=`<div class="tip"><span class="label">Materi · ${tip[0]}</span><p>${tip[1]}</p></div>`;
  return h;
}

function renderTest(){
  const id=st.ids[st.cur], q=byId(id), n=st.cur+1, tot=st.ids.length;
  const locked=isLocked(id), my=st.ans[id], opts=optsOf(q);
  let body='';
  if(q.sec==='L'){
    const used=st.plays[playKey(q)]||0, left=2-used, canPlay=st.mode==='prac'||st.done||left>0;
    let span='';
    if(q.g){const ps=st.ids.map((x,i)=>byId(x).g===q.g?i+1:0).filter(Boolean);
      span=ps.length>1?` · Rekaman untuk soal no. ${ps[0]}–${ps[ps.length-1]}`:'';
      span=(LGROUPS[q.g].part==='B'?' · Percakapan panjang':' · Ceramah')+span;}
    body+=`<div class="audio ${playing?'playing':''}" id="audio">
      <button class="play" id="play" ${(!canPlay||!hasTTS)?'disabled':''}>
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">${playing?'<rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/>':'<path d="M8 5v14l11-7z"/>'}</svg>
        ${playing?'Hentikan':'Putar audio'}</button>
      <span class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
      <span class="note">${st.mode==='sim'&&!st.done?`Sisa putar: <span class="mono">${left}</span>`:'Putar sebanyak yang dibutuhkan'}${span}</span>
    </div>
    <div class="stem">${q.q}</div>`;
  }else if(q.sec==='S'){
    body+=`<div class="stem">${q.q.replace('___','<span class="blank"></span>')}</div>`;
  }else if(q.sec==='W'){
    body+=`<div class="stem">${renderWE(q.s)}</div>`;
  }else{
    const P=PASSAGES[q.p];
    body+=`<div class="passage" tabindex="0"><h3>${P.title}</h3>${P.paras.map((t,k)=>`<p><span class="pn">¶${k+1}</span>${t}</p>`).join('')}</div>
      <div class="stem">${q.q}</div>`;
  }
  body+=`<div class="opts" role="radiogroup">${opts.map((o,k)=>{
    let c='opt';
    if(locked){if(k===q.a)c+=' right';else if(k===my)c+=' wrong'}
    else if(k===my)c+=' sel';
    return `<button class="${c}" data-k="${k}" role="radio" aria-checked="${k===my}" ${locked?'disabled':''}><span class="bub">${L4[k]}</span><span class="${q.sec==='W'?'uline':''}">${o}</span></button>`}).join('')}</div>`;
  if(locked){body+=feedbackHTML(q,my);if(q.sec==='L')body+=transcript(q)}

  const sim=simActive(), rg=sim?secRange():[0,tot-1], lastSec=sim&&st.si===st.secs.length-1;
  const endLabel=st.done?'Kembali ke hasil':confirmEnd?'Yakin? Klik lagi':sim?(lastSec?'Selesai ujian':'Akhiri bagian ini'):'Selesai';
  app.innerHTML=`
  <div class="bar">
    <div class="sec"><span class="label">${st.label} · Soal ${n} dari ${tot}</span><strong>${secTitle(q.sec)}</strong></div>
    <div class="row">
      <span class="timer" id="timer" title="${sim?'Sisa waktu bagian ini':'Waktu berjalan'}">00:00</span>
      <button class="btn ${confirmEnd?'danger':''}" id="end">${endLabel}</button>
      <button class="btn" id="home" title="Kembali ke beranda tanpa menyimpan">Keluar</button>
    </div>
  </div>
  <div class="test">
    <section class="qcard">
      <div class="qhead"><span class="qnum">No. ${n} · ${SEC[q.sec].name}${partOf(q)?' · Part '+partOf(q):''} · ${PACKS[q.pack].name}</span>
        ${st.mode==='sim'&&!st.done?`<button class="flag ${st.flags[id]?'on':''}" id="flag">${st.flags[id]?'Ditandai ragu':'Tandai ragu'}</button>`:''}</div>
      <div class="direction">${q.sec==='L'?PARTDIR[partOf(q)]:SEC[q.sec].dir}</div>
      ${body}
      <div class="nav">
        <button class="btn" id="prev" ${st.cur<=rg[0]?'disabled':''}>← Sebelumnya</button>
        ${st.cur<rg[1]?`<button class="btn primary" id="next">Berikutnya →</button>`:`<button class="btn primary ${confirmEnd?'danger':''}" id="end2">${st.done?'Kembali ke hasil':confirmEnd?'Yakin? Klik lagi':sim?(lastSec?'Selesai ujian':'Selesai bagian ini'):'Lihat hasil'}</button>`}
      </div>
    </section>
    ${renderSheet()}
  </div>`;
  updTimer();bindTest();
  const sh=app.querySelector('.sheet'),cc=app.querySelector('.cell.cur');
  if(sh&&cc&&sh.scrollHeight>sh.clientHeight)sh.scrollTop=Math.max(0,cc.offsetTop-sh.clientHeight/2);
}

function transcript(q){
  const talk=q.g&&LGROUPS[q.g].part==='C';
  const nm={W:talk?'Speaker':'Woman',M:talk?'Speaker':'Man',N:'Narrator'};
  return `<div class="transcript"><span class="label">Transkrip audio</span>${audioOf(q).map(l=>`<div><b>${nm[l.who]}:</b> ${l.t}</div>`).join('')}</div>`;
}

function renderSheet(){
  const groups=[];
  st.ids.forEach((id,pos)=>{const s=byId(id).sec,g=s==='W'?'S':s;let G=groups.find(x=>x.g===g);if(!G){G={g,list:[]};groups.push(G)}G.list.push({id,pos})});
  const gname={L:'Section 1 · Listening',S:'Section 2 · Structure & WE',R:'Section 3 · Reading'};
  const answered=st.ids.filter(id=>st.ans[id]!==undefined).length;
  return `<aside class="sheet" aria-label="Lembar jawaban">
    <div class="sheet-head"><strong>LEMBAR JAWABAN</strong><span class="mono" style="font-size:13px">${answered}/${st.ids.length}</span></div>
    ${groups.map(G=>`<div class="grp"><span class="label">${gname[G.g]}</span><div class="cells">${G.list.map(({id,pos})=>{
      let c='cell';const a=st.ans[id];
      if(isLocked(id))c+=a===byId(id).a?' ok':' no';else if(a!==undefined)c+=' ans';
      if(pos===st.cur)c+=' cur';if(st.flags[id]&&!st.done)c+=' flg';
      const off=simActive()&&(pos<secRange()[0]||pos>secRange()[1]);if(off)c+=' off';
      return `<button class="${c}" data-go="${pos}" aria-label="Soal ${pos+1}" ${off?'disabled':''}>${a!==undefined&&!isLocked(id)?L4[a]:pos+1}</button>`}).join('')}</div></div>`).join('')}
    <div class="legend">${st.done||st.mode==='prac'?'<span><i></i>Kosong</span><span><i class="g"></i>Benar</span><span><i class="r"></i>Salah</span>':'<span><i></i>Kosong</span><span><i class="a"></i>Terisi</span><span><i class="f"></i>Ragu</span>'}</div>
  </aside>`;
}

function bindTest(){
  const id=st.ids[st.cur];
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.k));
  app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(+b.dataset.go));
  const $=x=>document.getElementById(x);
  $('prev').onclick=()=>go(st.cur-1);
  if($('next'))$('next').onclick=()=>go(st.cur+1);
  if($('end2'))$('end2').onclick=endClick;
  $('end').onclick=endClick;
  $('home').onclick=renderHome;
  if($('flag'))$('flag').onclick=()=>{st.flags[id]=!st.flags[id];renderTest()};
  if($('play'))$('play').onclick=togglePlay;
}
function endClick(){
  if(st.done){renderResult(st.result);return}
  if(!confirmEnd){confirmEnd=true;renderTest();setTimeout(()=>{if(confirmEnd&&st&&!st.done&&st.phase==='test'){confirmEnd=false;renderTest()}},4000);return}
  if(st.mode==='sim')endSection(false);else finish();
}
function choose(k){const id=st.ids[st.cur];if(isLocked(id))return;st.ans[id]=k;confirmEnd=false;renderTest()}
function go(p){if(p<0||p>=st.ids.length)return;if(simActive()){const r=secRange();if(p<r[0]||p>r[1])return}stopAudio();playing=false;confirmEnd=false;st.cur=p;renderTest();window.scrollTo({top:0})}
function togglePlay(){
  const id=st.ids[st.cur],q=byId(id);
  if(q.sec!=='L')return;
  if(playing){stopAudio();playing=false;renderTest();return}
  const pk=playKey(q);
  if(st.mode==='sim'&&!st.done&&(st.plays[pk]||0)>=2)return;
  st.plays[pk]=(st.plays[pk]||0)+1;playing=true;renderTest();
  speak(audioOf(q),()=>{if(st&&st.ids[st.cur]===id){playing=false;renderTest()}else playing=false});
}

/* ================= SKOR ================= */
function finish(){
  stopAudio();playing=false;clearInterval(tick);
  if(st.done){renderResult(st.result);return}
  st.done=true;
  const cnt={L:[0,0],SW:[0,0],R:[0,0]};
  st.ids.forEach(id=>{const q=byId(id),k=q.sec==='S'||q.sec==='W'?'SW':q.sec;cnt[k][1]++;if(st.ans[id]===q.a)cnt[k][0]++});
  const range={L:[31,68],SW:[31,68],R:[31,67]}, scaled={};
  for(const k in cnt){if(cnt[k][1]){const [lo,hi]=range[k];scaled[k]=Math.round(lo+(cnt[k][0]/cnt[k][1])*(hi-lo))}}
  const full=['L','SW','R'].every(k=>cnt[k][1]>=10);
  const total=full?Math.round((scaled.L+scaled.SW+scaled.R)*10/3):null;
  const correct=st.ids.filter(id=>st.ans[id]===byId(id).a).length;
  const used=st.mode==='sim'?st.used:Math.floor((Date.now()-st.start)/1000);
  // perbarui daftar soal salah
  let wl=sget(WKEY,[]);
  st.ids.forEach(id=>{const ok=st.ans[id]===byId(id).a;if(ok)wl=wl.filter(x=>x!==id);else if(st.ans[id]!==undefined&&!wl.includes(id))wl.push(id)});
  sset(WKEY,wl);
  const h=sget(HKEY,[]);
  h.unshift({date:new Date().toLocaleDateString('id-ID',{day:'numeric',month:'short'}),label:st.label,score:full?total:`${correct}/${st.ids.length}`});
  sset(HKEY,h.slice(0,8));
  st.result={cnt,scaled,total,correct,used};
  revFilter=correct<st.ids.length?'wrong':'all';
  renderResult(st.result);
}

function band(t){
  if(t>=627)return'Setara level C1 (mahir).';
  if(t>=543)return'Setara level B2. Umumnya memenuhi syarat beasiswa dan S2 dalam negeri (biasanya 500–550).';
  if(t>=460)return'Setara level B1. Cukup untuk banyak syarat kelulusan S1 (umumnya 450–500).';
  if(t>=337)return'Setara level A2. Fokuskan latihan pada grammar dasar dan kosakata.';
  return'Di bawah A2. Mulailah dari Structure dan pola kalimat dasar.';
}

function renderResult(r){
  window.scrollTo(0,0);
  const lab={L:'Listening',SW:'Structure & WE',R:'Reading'};
  const rows=Object.keys(r.scaled).map(k=>{const [c,t]=r.cnt[k];return `<div class="barrow"><span>${lab[k]}</span><div class="track"><div class="fill" style="width:${t?c/t*100:0}%"></div></div><span class="mono">${c}/${t} · ${r.scaled[k]}</span></div>`}).join('');
  const wrongIds=st.ids.filter(id=>st.ans[id]!==byId(id).a);
  // materi yang paling sering salah
  const tc={};wrongIds.forEach(id=>{const t=byId(id).t;if(t)tc[t]=(tc[t]||0)+1});
  const topics=Object.entries(tc).sort((a,b)=>b[1]-a[1]);
  const list=revFilter==='wrong'?wrongIds:st.ids;
  app.innerHTML=`
  <div class="result">
    <header class="masthead"><span class="formcode">HASIL · ${st.label.toUpperCase()} · WAKTU ${fmtTime(r.used)}</span><h1>Hasil ujian</h1></header>
    <section class="score">
      <div><span class="label">${r.total!==null?'Perkiraan skor ITP':'Jawaban benar'}</span><div class="big">${r.total!==null?r.total:r.correct+'/'+st.ids.length}</div></div>
      <div class="bars">${rows}
        <p class="note">${r.total!==null?band(r.total)+' ':''}Angka di kanan adalah skor skala per bagian. Ini perkiraan dari ${st.ids.length} soal, bukan skor resmi.</p></div>
    </section>
    <div class="row">
      ${wrongIds.length?`<button class="btn primary" id="redo">Latihan ulang ${wrongIds.length} soal salah</button>`:''}
      <button class="btn ${wrongIds.length?'':'primary'}" id="again">Paket baru${selPack==='x'?' (acak)':''}</button>
      <button class="btn" id="rev">Telusuri soal satu per satu</button>
      <button class="btn" id="home">Beranda</button>
    </div>
    ${topics.length?`<section class="panel"><span class="label">Materi yang perlu dipelajari</span>
      <div class="topics">${topics.map(([t,c])=>`<details class="topic"><summary><span>${TIPS[t][0]}</span><span class="mono cnt">${c} salah</span></summary><p>${TIPS[t][1]}</p></details>`).join('')}</div></section>`:''}
    <section class="review">
      <div class="row" style="justify-content:space-between"><span class="label">Pembahasan</span>
        <div class="chips sm"><button class="chip ${revFilter==='wrong'?'on':''}" data-f="wrong">Salah saja (${wrongIds.length})</button><button class="chip ${revFilter==='all'?'on':''}" data-f="all">Semua (${st.ids.length})</button></div></div>
      ${list.length?list.map(id=>{const pos=st.ids.indexOf(id),q=byId(id),my=st.ans[id],ok=my===q.a;
        const txt=q.sec==='W'?q.s.replace(/[{}]/g,''):q.q;
        return `<details ${!ok&&revFilter==='wrong'?'open':''}><summary><span class="mk ${my===undefined?'na':ok?'ok':'no'}">${pos+1}</span><span class="sum">${txt}</span><span class="tag hidden-sm">${SEC[q.sec].name.split(' ')[0]}</span></summary>
          <div class="body">
            ${q.sec==='W'?`<div class="stem sm">${renderWE(q.s)}</div>`:''}
            ${q.sec==='R'?`<div class="note">Bacaan: ${PASSAGES[q.p].title}</div>`:''}
            <div class="tag">Jawabanmu: <span class="${ok?'ok-t':'no-t'}">${my===undefined?'—':L4[my]+'. '+optsOf(q)[my]}</span> · Kunci: <span class="ok-t">${L4[q.a]}. ${optsOf(q)[q.a]}</span></div>
            ${feedbackHTML(q,my)}
            ${q.sec==='L'?transcript(q):''}
          </div></details>`}).join(''):'<p class="note">Semua jawaban benar. Tidak ada yang perlu diulang.</p>'}
    </section>
  </div>`;
  const $=x=>document.getElementById(x);
  const mode=st.mode;
  if($('redo'))$('redo').onclick=()=>startTest('prac',wrongIds,'Ulang soal salah');
  $('again').onclick=()=>{const secs=[...new Set(st.ids.map(id=>byId(id).sec))];startTest(mode,packSet(selPack,secs),packLabel(selPack)+(mode==='sim'?' · Simulasi':' · Latihan'))};
  $('home').onclick=renderHome;
  $('rev').onclick=()=>{st.cur=0;renderTest()};
  app.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{revFilter=b.dataset.f;renderResult(r)});
}

/* ================= KEYBOARD ================= */
document.addEventListener('keydown',e=>{
  if(!st||e.ctrlKey||e.metaKey||e.altKey)return;
  if(!document.querySelector('.qcard')||st.phase!=='test')return;
  const k=e.key.toLowerCase();
  if(k.length===1&&'abcd'.includes(k)){choose('abcd'.indexOf(k));return}
  if(e.key==='ArrowRight'){go(st.cur+1);return}
  if(e.key==='ArrowLeft'){go(st.cur-1);return}
  if(e.key===' '&&byId(st.ids[st.cur]).sec==='L'&&!e.target.closest('button,summary')){e.preventDefault();togglePlay()}
});

/* tombol Back di Android */
window.__back=function(){if(st){renderHome();window.scrollTo(0,0);return true}return false};

renderHome();
</script>

<script>if("serviceWorker" in navigator&&location.protocol==="https:"){navigator.serviceWorker.register("sw.js").catch(function(){})}</script>
</body></html>
