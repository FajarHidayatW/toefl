<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#16805f"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="TOEFL ITP"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Simulasi TOEFL ITP</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Layout: lembar jawaban komputer (LJK) — soal di kiri, lembar bulatan jawaban di kanan; tinta "drop-out" hijau, isian pensil grafit */
:root{
  --paper:#f4f7f6; --card:#ffffff; --ink:#1b2422; --muted:#5d6966; --line:#d3dcd9;
  --drop:#16805f; --drop-soft:#e1f1ea; --graphite:#2a2e33; --on-graphite:#ffffff;
  --good:#2b7a3d; --good-soft:#e3f3e6; --bad:#b93a2e; --bad-soft:#fbe8e5; --warn:#a8660b;
  --f-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --f-read:"Source Serif 4",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#111614; --card:#18201d; --ink:#e4ebe8; --muted:#97a5a0; --line:#2b3632;
  --drop:#4dc39e; --drop-soft:#16302a; --graphite:#dde3e6; --on-graphite:#111614;
  --good:#74c886; --good-soft:#18301f; --bad:#f08072; --bad-soft:#3a1d19; --warn:#e3a54a; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111614; --card:#18201d; --ink:#e4ebe8; --muted:#97a5a0; --line:#2b3632;
  --drop:#4dc39e; --drop-soft:#16302a; --graphite:#dde3e6; --on-graphite:#111614;
  --good:#74c886; --good-soft:#18301f; --bad:#f08072; --bad-soft:#3a1d19; --warn:#e3a54a; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:1120px;margin:0 auto;padding-block:20px 48px}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.2}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible{outline:2px solid var(--drop);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.label{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.btn{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:9px 16px;font-weight:500}
.btn:hover{border-color:var(--drop)}
.btn.primary{background:var(--drop);border-color:var(--drop);color:var(--card)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
kbd{font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--card)}

/* HOME */
.home{display:grid;gap:28px}
.masthead{display:grid;gap:10px;padding-block:12px 4px;border-bottom:2px solid var(--drop)}
.masthead h1{font-size:clamp(28px,4.4vw,42px);font-weight:700;letter-spacing:-.01em}
.masthead p{margin:0;color:var(--muted);max-width:62ch}
.formcode{font-family:var(--f-mono);font-size:12px;color:var(--drop);letter-spacing:.06em}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:20px;display:grid;gap:14px;align-content:start;min-width:0}
.panel h2{font-size:19px}
.panel p{margin:0;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fmt{width:100%;border-collapse:collapse;font-size:14px}
.fmt th,.fmt td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
.fmt th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.fmt td.n{font-family:var(--f-mono);text-align:right}
.hist{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.hist li{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed var(--line);padding-block:6px;font-size:14px}
.hist .sc{font-family:var(--f-mono);font-weight:600;color:var(--drop)}
.keys{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted)}

/* TEST */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding-block:12px;border-bottom:1px solid var(--line);margin-bottom:20px}
.bar .sec{display:grid;gap:2px}
.bar .sec strong{font-size:16px}
.timer{font-family:var(--f-mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;padding:4px 12px;border:1.5px solid var(--ink);border-radius:6px}
.timer.low{color:var(--bad);border-color:var(--bad)}
.test{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
@media (max-width:860px){.test{grid-template-columns:minmax(0,1fr)}}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:22px;display:grid;gap:18px;min-width:0}
.qhead{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.qnum{font-family:var(--f-mono);font-weight:600;font-size:14px;color:var(--drop)}
.direction{font-size:13px;color:var(--muted);border-left:3px solid var(--drop);padding-left:10px}
.stem{font-size:18px;line-height:1.6}
.blank{display:inline-block;min-width:5.5em;border-bottom:2px solid var(--ink);margin:0 2px}
.u{position:relative;display:inline-block;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px;margin-bottom:16px}
.u::after{content:attr(data-l);position:absolute;left:50%;transform:translateX(-50%);top:1.55em;font-family:var(--f-mono);font-size:11px;font-weight:600;color:var(--drop)}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:14px;align-items:center;text-align:left;width:100%;background:transparent;border:1px solid var(--line);border-radius:8px;padding:10px 14px;min-height:48px}
.opt:hover:not(:disabled){border-color:var(--drop);background:var(--drop-soft)}
.bub{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--drop);color:var(--drop);display:grid;place-items:center;font-family:var(--f-mono);font-size:13px;font-weight:600}
.opt.sel .bub{background:var(--graphite);border-color:var(--graphite);color:var(--on-graphite)}
.opt.sel{border-color:var(--graphite)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .bub{background:var(--good);border-color:var(--good);color:var(--card)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .bub{background:var(--bad);border-color:var(--bad);color:var(--card)}
.opt:disabled{cursor:default}
.opt .uline{text-decoration:underline;text-underline-offset:3px}
.feedback{border-radius:8px;padding:14px 16px;display:grid;gap:6px;font-size:14px}
.feedback.ok{background:var(--good-soft)}
.feedback.no{background:var(--bad-soft)}
.feedback strong{font-size:15px}
.audio{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:14px;border:1px dashed var(--drop);border-radius:8px;background:var(--drop-soft)}
.play{display:flex;align-items:center;gap:10px;border:none;background:var(--drop);color:var(--card);border-radius:999px;padding:9px 18px 9px 12px;font-weight:600}
.play:disabled{opacity:.45;cursor:not-allowed}
.play svg{width:20px;height:20px}
.wave{display:flex;gap:3px;align-items:end;height:18px}
.wave i{width:3px;background:var(--drop);border-radius:2px;height:4px}
.playing .wave i{animation:w .9s ease-in-out infinite}
.wave i:nth-child(2){animation-delay:.15s}.wave i:nth-child(3){animation-delay:.3s}.wave i:nth-child(4){animation-delay:.45s}.wave i:nth-child(5){animation-delay:.6s}
@keyframes w{0%,100%{height:4px}50%{height:18px}}
@media (prefers-reduced-motion:reduce){.playing .wave i{animation:none;height:12px}}
.transcript{font-size:14px;display:grid;gap:4px;background:var(--paper);border-radius:6px;padding:12px}
.transcript b{font-family:var(--f-mono);font-size:12px;color:var(--drop)}
.passage{font-family:var(--f-read);font-size:16.5px;line-height:1.7;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:16px 18px;max-height:46vh;overflow:auto;display:grid;gap:12px}
.passage h3{font-family:var(--f-ui);font-size:14px}
.passage p{margin:0;max-width:68ch}
.passage .pn{font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-right:6px}
.nav{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.flag{border:1px solid var(--line);background:transparent;border-radius:6px;padding:5px 10px;font-size:13px}
.flag.on{border-color:var(--warn);color:var(--warn)}

/* LJK SHEET */
.sheet{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;display:grid;gap:14px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 78px)}
@media (max-width:860px){.sheet{position:static}}
.sheet-head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--drop);padding-bottom:8px}
.sheet-head strong{color:var(--drop);font-size:14px;letter-spacing:.04em}
.grp{display:grid;gap:6px}
.cells{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.cell{position:relative;border:1.5px solid var(--drop);background:transparent;color:var(--drop);border-radius:50%;aspect-ratio:1;max-width:100%;font-family:var(--f-mono);font-size:12px;font-weight:600;display:grid;place-items:center;padding:0}
.cell.ans{background:var(--graphite);border-color:var(--graphite);color:var(--on-graphite)}
.cell.cur{outline:2px solid var(--drop);outline-offset:2px}
.cell.ok{background:var(--good);border-color:var(--good);color:var(--card)}
.cell.no{background:var(--bad);border-color:var(--bad);color:var(--card)}
.cell.flg::after{content:"";position:absolute;top:-2px;right:-2px;width:8px;height:8px;border-radius:50%;background:var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--drop)}
.legend i.a{background:var(--graphite);border-color:var(--graphite)}
.legend i.f{background:var(--warn);border-color:var(--warn)}

/* RESULT */
.result{display:grid;gap:24px}
.score{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:24px}
@media (max-width:600px){.score{grid-template-columns:1fr}}
.big{font-family:var(--f-mono);font-size:clamp(52px,9vw,76px);font-weight:600;line-height:1;color:var(--drop);font-variant-numeric:tabular-nums}
.bars{display:grid;gap:12px;min-width:0}
.barrow{display:grid;grid-template-columns:minmax(0,150px) 1fr auto;gap:12px;align-items:center;font-size:14px}
.track{height:10px;background:var(--paper);border:1px solid var(--line);border-radius:999px;overflow:hidden}
.fill{height:100%;background:var(--drop)}
.note{font-size:13px;color:var(--muted);margin:0}
.review{display:grid;gap:8px}
.review details{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 16px}
.review summary{display:flex;gap:12px;align-items:center;cursor:pointer;list-style:none}
.review summary::-webkit-details-marker{display:none}
.review .mk{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--card)}
.review .mk.ok{background:var(--good)}.review .mk.no{background:var(--bad)}.review .mk.na{background:var(--muted)}
.review .sum{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.review .body{display:grid;gap:8px;padding-top:12px;font-size:14px}
.tag{font-family:var(--f-mono);font-size:12px}
.ok-t{color:var(--good)}.no-t{color:var(--bad)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:7px 16px;font-weight:500}
.chip:hover{border-color:var(--drop)}
.chip.on{background:var(--drop);border-color:var(--drop);color:var(--card)}
.chips.sm .chip{padding:4px 12px;font-size:13px}
.feedback.na{background:var(--paper);border:1px solid var(--line)}
.why{display:grid;gap:2px}
.why p{margin:0}
.why.no .label{color:var(--bad)}
.why.ok .label{color:var(--good)}
.others summary{cursor:pointer;font-size:13px;color:var(--muted)}
.others ul{margin:6px 0 0;padding-left:18px;display:grid;gap:4px}
.tip{border:1px solid var(--drop);border-left-width:4px;border-radius:6px;padding:12px 14px;display:grid;gap:4px;font-size:14px}
.tip .label{color:var(--drop)}
.tip p{margin:0;max-width:72ch}
.topics{display:grid;gap:6px}
.topic{border-bottom:1px solid var(--line);padding-block:6px}
.topic summary{display:flex;justify-content:space-between;gap:12px;cursor:pointer;font-weight:500}
.topic .cnt{color:var(--bad);font-size:13px;flex:none}
.topic p{margin:6px 0 4px;font-size:14px;color:var(--muted);max-width:72ch}
.legend i.g{background:var(--good);border-color:var(--good)}
.legend i.r{background:var(--bad);border-color:var(--bad)}
.stem.sm{font-size:16px}
@media (pointer:coarse){.keys{display:none}}
.syncbox{display:grid;gap:8px}
.code{width:100%;font-family:var(--f-mono);font-size:12px;line-height:1.4;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);resize:vertical;word-break:break-all}
.code:focus{outline:2px solid var(--drop);outline-offset:1px}
.note.err{color:var(--bad)}
.hidden-sm{}
@media (max-width:520px){.hidden-sm{display:none}.stem{font-size:17px}.qcard{padding:16px}}
</style>

</head><body><div class="wrap" id="app"></div>

<script>
/* ================= MATERI SINGKAT ================= */
const TIPS={
 'l-correction':['Koreksi informasi','Kata "Actually…", "Not exactly…", "In fact…" menandakan pembicara kedua mengoreksi anggapan pembicara pertama. Jawabannya biasanya informasi baru dari pembicara kedua.'],
 'l-but':['Pola "…, but …"','Bagian setelah "but" adalah inti jawaban. "I\'d love to, but…" atau "I was going to, but…" berarti tidak jadi atau tidak bisa.'],
 'l-suggest':['Ungkapan saran','"Why don\'t you…", "Why not…", "How about…", "Did you check…?", "I\'d … instead" adalah saran. Pertanyaan "What does the man suggest?" mencari isi saran itu.'],
 'l-echo':['Jebakan kata yang sama','Pilihan yang memakai kata persis dari audio sering justru salah. Jawaban benar biasanya memakai sinonim atau parafrase.'],
 'l-implied':['Makna tersirat','Pembicara sering tidak menjawab langsung. Simpulkan dari alasan, kebiasaan, atau saran yang ia sebut ("That\'s why…", "I wouldn\'t go out without…").'],
 'l-plan':['Rencana dan niat','"Not yet, but I\'m planning to…", "I\'m going to…", "I intend to…" menunjukkan sesuatu yang belum terjadi tapi akan dilakukan.'],
 'l-main':['Topik utama ceramah','Ide pokok hampir selalu disebut di awal ("Today we\'ll look at…"). Nama tokoh, angka, atau contoh di akhir biasanya hanya detail pendukung.'],
 'l-detail':['Detail yang disebut','Untuk "According to the speaker…", cocokkan dengan kalimat spesifik di audio. Waspadai pilihan yang mencampur dua detail berbeda.'],
 'l-agree':['Ungkapan setuju','"So do I / So did I", "Me too", "Neither do I", "You can say that again", "Tell me about it" berarti setuju dengan pembicara sebelumnya.'],
 'l-idiom':['Idiom percakapan','Idiom tidak diartikan harfiah. "You can say that again" = sangat setuju. "Do you mind…?" dijawab "Not at all" = boleh. "I could hardly keep my eyes open" = sangat bosan/mengantuk. "Don\'t count on it" = jangan berharap. "In a heartbeat" = tanpa ragu.'],
 'l-condition':['Pengandaian dan penyesalan','"I would if I had…" berarti kenyataannya tidak. "I wish I hadn\'t…" berarti menyesal sudah melakukannya. Maknanya kebalikan dari bentuk kalimatnya.'],
 'l-negative':['Kata bermakna negatif','"Hardly", "rarely", "barely", "seldom" berarti hampir tidak. "Hardly anyone deserved it more" = dialah yang paling layak. Negatif + comparative bermakna sangat positif: "Couldn\'t be better" = sangat baik.'],
 'sva':['Subject–verb agreement','Kata kerja mengikuti subjek inti, bukan kata benda di frasa sisipan. Each / every / the number of / neither of → tunggal. Subjek gabungan "A and B" → jamak. Pada either…or dan neither…nor, ikuti subjek yang paling dekat.'],
 'inversion':['Inversi','Jika kalimat dibuka kata negatif atau terbatas (Not until, Only after, Rarely, Seldom, Never, Not only), urutannya menjadi auxiliary + subjek + verb. Contoh: "Rarely have I seen…", "Not only does she…".'],
 'appositive':['Appositive','Frasa benda di antara koma yang menjelaskan subjek, tanpa kata kerja: "Jakarta, the capital of Indonesia, is…". Jika memakai who/which, klausanya harus punya kata kerja.'],
 'comparative':['Perbandingan','Comparative: -er / more + than. Superlative: the + -est / most. Pola paralel: "The more…, the more…". Jangan menggandakan, misalnya "more larger".'],
 'participle':['Participle sebagai keterangan','Past participle (V3) bermakna pasif: "Founded in 1636, Harvard…", "The bridge built last year…". Present participle (V-ing) bermakna aktif.'],
 'so-such':['So / such … that','so + adjective/adverb + that, misalnya "so quickly that". such + (a) + adjective + noun + that, misalnya "such a fast plant that".'],
 'conjunction':['Konjungsi vs preposisi','Konjungsi (although, because, until, while) diikuti klausa S + V. Preposisi (despite, in spite of, because of, during) diikuti kata benda atau V-ing. Although dan but tidak dipakai bersamaan.'],
 'subjunctive':['Subjunctive','Setelah "it is essential/important/necessary that" atau "suggest/recommend/insist that", pakai bentuk dasar verb untuk semua subjek: "that he submit".'],
 'missing-verb':['Kalimat tanpa kata kerja','Setiap kalimat butuh subjek dan kata kerja utama. Cek dulu apakah kalimat sudah punya verb. V-ing atau to-infinitive saja tidak bisa menjadi verb utama.'],
 'preposition':['Preposisi pembanding','"Unlike / Like + noun" dipakai untuk membandingkan. "Alike" adalah adjective/adverb dan tidak diikuti noun ("They look alike").'],
 'parallel':['Paralelisme','Unsur dalam daftar atau yang dihubungkan and/or/but harus sejenis: noun–noun–noun, V-ing–V-ing, verb lampau–verb lampau.'],
 'wordform':['Bentuk kata','Adjective menerangkan noun (a successful flight). Adverb menerangkan verb (explained clearly). "Interesting" = menarik (sifat sesuatu), "interested" = tertarik (perasaan orang).'],
 'countable':['Uncountable noun','Information, equipment, furniture, advice, news, luggage tidak punya bentuk jamak dan memakai verb tunggal. Sebaliknya, "one of the" selalu diikuti noun jamak.'],
 'pronoun':['Kasus pronoun','Setelah preposisi (between, for, with, to) pakai object pronoun: me, him, her, us, them. Jadi "between you and me".'],
 'tense':['Tenses','Present perfect: have/has + V3 (has flown). Past perfect: had + V3 untuk kejadian sebelum kejadian lampau lain ("By the time we arrived, the film had started"). Durasi memakai "for", titik waktu memakai "since".'],
 'gerund-inf':['Gerund dan infinitive','Gerund (V-ing) bisa menjadi subjek ("Managing time is…") dan dipakai setelah preposisi (look forward to visiting, excited about opening). Pola ask/tell/want + objek + to + verb.'],
 'conditional':['Kalimat pengandaian','Type 1: If + present, will + V ("If it rains, …"). Type 2: If + past, would + V ("If I had time, I would…"). Type 3 (masa lalu yang tidak terjadi): If + had + V3, would have + V3. Klausa "if" tidak memakai will.'],
 'noun-clause':['Noun clause','Klausa yang diawali what, that, whether, atau how bisa menjadi subjek. "What is known about Majapahit comes from…": "What is known…" adalah subjek dari verb "comes".'],
 'relative':['Relative pronoun','Who untuk orang (subjek), whom untuk orang (objek), which untuk benda, whose untuk kepemilikan. Klausa relatif harus punya verb sendiri.'],

 'article':['Artikel a / an','"An" dipakai sebelum bunyi vokal (an engineer, an hour). "A" dipakai sebelum bunyi konsonan (a university, a European).'],

 'r-detail':['Pertanyaan detail','Jawaban "According to the passage…" tertulis jelas. Temukan kata kuncinya di bacaan, lalu baca kalimat itu dengan teliti. Angka dan kata yang mirip sering jadi jebakan.'],

const PASSAGES={
 borobudur:{title:'Borobudur',paras:[
  "Borobudur, located in Central Java, is the largest Buddhist monument in the world. It was built during the eighth and ninth centuries under the Sailendra dynasty. The monument consists of nine stacked platforms: six square ones at the base and three circular ones above them, crowned by a large central stupa. Its walls and balustrades are decorated with 2,672 relief panels and 504 statues of the Buddha. Pilgrims traditionally walked around each level in a clockwise direction, so that the carved stories unfolded in order as they climbed toward the top.",
  "For several centuries the monument was abandoned. Volcanic ash and jungle growth slowly covered it, and it was largely forgotten by the outside world. In 1814, Sir Thomas Stamford Raffles, then the British lieutenant-governor of Java, learned of its existence and sent an engineer to investigate. Clearing the site took weeks of work. A major restoration supported by UNESCO took place between 1975 and 1982, and in 1991 Borobudur was listed as a World Heritage Site. Today it is one of Indonesia's most visited attractions."]},
 mangrove:{title:'Mangrove Forests',paras:[
  "Mangroves are trees and shrubs that grow along tropical and subtropical coastlines, in the zone where land meets the sea. They can survive in salty water that would kill most other plants, and many species have special roots that rise above the mud to take in air during high tide.",
  "These forests provide important benefits to coastal communities. Their dense roots trap sediment and reduce the force of waves, which helps protect shorelines from erosion and storms. They also serve as nurseries where young fish, crabs, and shrimp can grow safely before moving to the open sea. In addition, mangrove soils store large amounts of carbon, which makes these forests valuable in the fight against climate change.",
  "Indonesia has more mangrove forest than any other country. However, large areas have been cleared over recent decades, mainly to make room for fish and shrimp ponds, as well as for coastal development. Many local governments and communities now run replanting programs, although scientists point out that restored forests may take many years to provide the full benefits of the original ones."]},
 batik:{title:'Batik',paras:[
  "Batik is a technique of decorating cloth by applying wax to the parts that should not absorb dye. Craftspeople traditionally use a small copper tool called a canting to draw lines of hot wax by hand. After the cloth is dyed, the wax is removed, revealing the pattern underneath. Because the process may be repeated several times with different colors, a single piece of hand-drawn batik can take weeks or even months to complete. A faster method uses a copper stamp, known as a cap, to print the wax onto the fabric.",
  "Batik designs often carry meaning. In the royal courts of Yogyakarta and Surakarta, certain patterns, such as parang, were once reserved for members of the nobility. Batik from coastal towns like Pekalongan, by contrast, tends to use brighter colors and shows influences from Chinese, Arab, and European traders who visited these ports. In 2009, UNESCO recognized Indonesian batik as part of the Intangible Cultural Heritage of Humanity, and October 2 is now celebrated as National Batik Day."]},
 sleep:{title:'Sleep and Memory',paras:[
  "Many students believe that staying up all night is the best way to prepare for an exam. Research on sleep, however, suggests the opposite. While we sleep, the brain does not simply rest. It replays and organizes information gathered during the day, a process scientists call memory consolidation. During deep sleep, new memories appear to be transferred from the hippocampus, a region that stores information temporarily, to other parts of the brain where they can be kept for a longer time.",
  "Experiments have shown that people who sleep after learning a list of words remember more of them the next day than people who stay awake for the same amount of time. Lack of sleep also reduces attention and makes it harder to learn new material in the first place. For these reasons, health experts recommend that adults sleep at least seven hours a night. They also advise avoiding bright screens before bed, since the light can delay the release of melatonin, a hormone that helps the body prepare for sleep."]},
 rafflesia:{title:'Rafflesia',paras:[
  "Rafflesia arnoldii, found in the rainforests of Sumatra and Borneo, produces the largest single flower in the world. A fully open bloom can measure nearly one meter across and weigh several kilograms. The plant is unusual in another way as well: it has no leaves, stems, or true roots. Instead, it lives as a parasite inside a type of tropical vine, taking all of its water and nutrients from its host.",
  "For most of its life the plant is invisible, growing as thin threads within the vine. Eventually a bud breaks through the bark and slowly swells over a period of several months. When the flower finally opens, it gives off a strong smell similar to rotting meat. This odor attracts flies, which carry pollen from one flower to another. The bloom lasts only about a week before it turns black and collapses. Because the plant depends on a specific host and on forest habitat, it is threatened by deforestation."]},
 krakatau:{title:'The 1883 Eruption of Krakatau',paras:[
  "In August 1883, the volcanic island of Krakatau, located in the Sunda Strait between Java and Sumatra, erupted with tremendous force. The final explosions were so loud that they were heard on an island in the Indian Ocean nearly 4,800 kilometers away. Most of the island disappeared, and the eruption generated huge waves, or tsunamis, that struck the coasts of Java and Sumatra. More than 36,000 people lost their lives, most of them because of the waves rather than the eruption itself.",
  "The effects of the disaster were felt around the world. Fine ash and gases rose high into the atmosphere, where they blocked part of the sunlight. As a result, average global temperatures dropped slightly for several years. People in Europe and North America reported unusually red and colorful sunsets. In 1927, a new volcano began to rise from the sea where Krakatau had been. Named Anak Krakatau, or \"Child of Krakatau,\" it remains active today."]},
 orangutan:{title:'Orangutans',paras:[
  "Orangutans are great apes found only on the islands of Borneo and Sumatra. Their name comes from Malay words meaning \"person of the forest.\" Orangutans spend most of their lives in trees, where they find fruit, leaves, and insects to eat. Each night, an adult orangutan builds a new nest high in the branches by bending and weaving leafy branches together.",
  "Orangutans have one of the slowest reproduction rates of any mammal. A female usually gives birth only once every seven or eight years. The young orangutan stays with its mother for several years, learning which plants are safe to eat and how to build nests. Because of this slow rate, populations recover very slowly when their numbers fall. The greatest threat to orangutans is the loss of forest habitat, which is cleared for farming, plantations, and logging. Three species are now recognized, and all of them are listed as critically endangered."]},
 gardencity:{title:'The Garden City',paras:[
  "At the end of the nineteenth century, many industrial cities in Britain were crowded, polluted, and unhealthy. In 1898, a British reformer named Ebenezer Howard proposed a solution in a book later published as Garden Cities of To-morrow. Howard imagined new towns that would combine the advantages of the city, such as jobs and culture, with the advantages of the countryside, such as fresh air and open space.",
  "In Howard's plan, each garden city would have a fixed population of about 32,000 people. The town would be arranged in a circular pattern, with a central park surrounded by public buildings, homes, and wide avenues. Factories would be placed at the edge of the town, and the whole settlement would be surrounded by a permanent belt of farmland. When a town reached its limit, a new garden city would be built nearby instead of letting the first one grow larger. Two towns were built on these principles in England: Letchworth, begun in 1903, and Welwyn Garden City, begun in 1920. Howard's ideas later influenced the planning of new towns in many countries."]},
 subak:{title:'Subak',paras:[
  "In Bali, rice farmers have managed water through a system called subak for more than a thousand years. A subak is a community of farmers who share water from a single source, such as a spring or a river. The water flows through a network of canals, tunnels, and small dams, and it is divided among the rice terraces according to rules agreed upon by the members.",
  "The system is closely connected to Balinese religious life. Water temples are located at springs, at lakes, and along the canals, and priests and farmers meet at these temples to decide when to plant and how to share water. By coordinating planting schedules, neighboring fields can be flooded or left dry at the same time, which helps reduce pests. In 2012, UNESCO listed the cultural landscape of Bali, including the subak system, as a World Heritage Site."]},
 gutenberg:{title:"Gutenberg's Printing Press",paras:[
  "Before the fifteenth century, books in Europe were copied by hand, usually by monks or professional scribes. A single book could take months to produce, so books were rare and expensive. Around 1440, Johannes Gutenberg, a goldsmith from the German city of Mainz, developed a printing system that changed this situation. His key idea was movable metal type: individual letters cast in metal that could be arranged into pages, printed, and then rearranged for new pages. He also developed an oil-based ink that stuck well to metal, and he adapted a press similar to those used to make wine.",
  "Gutenberg's most famous work, a Bible printed around 1455, showed that printed books could be as beautiful as handwritten ones. The new technology spread quickly. By 1500, printing shops were operating in more than 200 European cities, and millions of books had been produced. Because books became cheaper, more people learned to read, and new ideas in science and religion could travel faster than ever before."]}
};

 {sec:'W',s:'The {number} of students {who} use public transport {have} {increased}.',a:2,t:'sva',

 L:{name:'Listening Comprehension',dir:'Dengarkan percakapan, lalu pilih jawaban terbaik. Teks audio baru ditampilkan setelah jawaban diperiksa.'},
 S:{name:'Structure',dir:'Pilih kata atau frasa yang paling tepat untuk melengkapi kalimat.'},
 W:{name:'Written Expression',dir:'Pilih satu bagian bergaris bawah yang SALAH dan harus diperbaiki.'},
 R:{name:'Reading Comprehension',dir:'Baca teks, lalu jawab pertanyaan berdasarkan isi bacaan.'}
};
const L4='ABCD';
const byId=id=>Q.find(q=>q.id===id);

/* ================= STORAGE ================= */
function sget(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function sset(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

/* ================= TTS ================= */
const synth=('speechSynthesis' in window)?window.speechSynthesis:null;
let voices=[];
function loadVoices(){if(!synth)return;voices=synth.getVoices().filter(v=>/^en[-_]/i.test(v.lang))}
if(synth){loadVoices();synth.onvoiceschanged=loadVoices}
function pickVoice(who){
  if(!voices.length)return null;
  const us=voices.filter(v=>/en[-_]US/i.test(v.lang));const pool=us.length?us:voices;
  const fem=/female|zira|samantha|aria|jenny|susan|hazel|karen|victoria|libby|sonia|michelle|ava|allison/i;
  const mal=/\bmale|david|mark|guy|daniel|alex|george|ryan|fred|christopher|eric|tom/i;
  if(who==='W')return pool.find(v=>fem.test(v.name))||pool[0];
  if(who==='M')return pool.find(v=>mal.test(v.name)&&!/female/i.test(v.name))||pool[1]||pool[0];
  return pool.find(v=>/google/i.test(v.name))||pool[0];
}
/* Suara asli Android (WebView tidak punya speechSynthesis) */
const nativeTTS=window.AndroidTTS||null;
const hasTTS=!!(nativeTTS||synth);
let ttsSeq=0, ttsDone=null;
window.__ttsDone=function(id){if(id===String(ttsSeq)&&ttsDone){const f=ttsDone;ttsDone=null;f()}};
function speak(lines,onEnd){
  if(nativeTTS){
    const parts=[];
    lines.forEach(l=>l.t.split(/(?<=[.?!])\s+/).forEach(s=>parts.push({t:s,p:l.who==='W'?1.25:l.who==='M'?.85:1})));
    ttsSeq++;ttsDone=onEnd||null;
    nativeTTS.speakAll(JSON.stringify(parts),String(ttsSeq));
    return;
  }
  if(!synth){onEnd&&onEnd();return}
  synth.cancel();
  const parts=[];
  lines.forEach(l=>l.t.split(/(?<=[.?!])\s+/).forEach(s=>parts.push({who:l.who,t:s})));
  parts.forEach((p,i)=>{
    const u=new SpeechSynthesisUtterance(p.t);
    u.lang='en-US';const v=pickVoice(p.who);if(v)u.voice=v;
    u.rate=.95;u.pitch=p.who==='W'?1.25:p.who==='M'?.85:1;
    if(i===parts.length-1)u.onend=u.onerror=()=>onEnd&&onEnd();
    synth.speak(u);
  });
}
function stopAudio(){ttsDone=null;if(nativeTTS){try{nativeTTS.stop()}catch(e){}}else if(synth)synth.cancel()}

/* ================= PEMILIHAN SOAL ================= */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function randomSet(){
  // Listening: 8 percakapan acak + 1 pasang ceramah; Reading: 2 bacaan acak
  const conv=shuffle(Q.filter(q=>q.sec==='L'&&!q.talk)).slice(0,8);
  const tp=Math.floor(Math.random()*PACKS.length);
  const talk=Q.filter(q=>q.sec==='L'&&q.talk&&q.pack===tp);
  const S=shuffle(Q.filter(q=>q.sec==='S')).slice(0,10);
  const W=shuffle(Q.filter(q=>q.sec==='W')).slice(0,10);
  const ps=shuffle(Object.keys(PASSAGES)).slice(0,2);
  const R=ps.flatMap(p=>Q.filter(q=>q.p===p));
  return [...conv,...talk,...S,...W,...R].map(q=>q.id);
}
function packSet(pack,secs){
  if(pack==='x'){return randomSet().filter(id=>secs.includes(byId(id).sec))}
  return Q.filter(q=>q.pack===pack&&secs.includes(q.sec)).map(q=>q.id);
}
function packLabel(p){return p==='x'?'Acak':PACKS[p].name}

/* ================= STATE ================= */
let st=null, tick=null, playing=false, confirmEnd=false, revFilter='wrong';

function startTest(mode,ids,label){
  stopAudio();playing=false;
  st={mode,ids,label,cur:0,ans:{},plays:{},flags:{},start:Date.now(),limit:mode==='sim'?30*60:0,done:false};
  confirmEnd=false;clearInterval(tick);
  if(st.limit)tick=setInterval(()=>{updTimer();if(remaining()<=0)finish()},1000);
  renderTest();window.scrollTo(0,0);
}
function remaining(){return st.limit-Math.floor((Date.now()-st.start)/1000)}
function fmtTime(s){s=Math.max(0,s);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function updTimer(){const el=document.getElementById('timer');if(!el||!st)return;
  if(st.done){el.textContent=fmtTime(st.result.used);el.classList.remove('low');return}
  if(st.limit){const r=remaining();el.textContent=fmtTime(r);el.classList.toggle('low',r<=300)}
  else el.textContent=fmtTime(Math.floor((Date.now()-st.start)/1000));}

function orderIds(ids){const o={L:0,S:1,W:2,R:3};return ids.slice().sort((a,b)=>{const A=byId(a),B=byId(b);return o[A.sec]-o[B.sec]||a-b})}

/* ================= TEST ================= */
function isLocked(id){return st.done||(st.mode==='prac'&&st.ans[id]!==undefined)}
function secTitle(sec){return sec==='S'||sec==='W'?'Structure & Written Expression':SEC[sec].name}
function renderWE(s){let k=0;return s.replace(/\{([^}]+)\}/g,(m,t)=>`<span class="u" data-l="${L4[k++]}">${t}</span>`)}
function optsOf(q){return q.sec==='W'?[...q.s.matchAll(/\{([^}]+)\}/g)].map(m=>m[1]):q.opts}
function wrongNote(q,k){
  if(q.w&&q.w[k])return q.w[k];
  return q.sec==='W'?`Bagian "${optsOf(q)[k]}" sudah benar. Kesalahannya ada di bagian lain.`:'Pilihan ini tidak didukung informasi dalam soal.';
}

function feedbackHTML(q,my){
  const opts=optsOf(q), ok=my===q.a, tip=TIPS[q.t];
  const state=my===undefined?'na':ok?'ok':'no';
  let h=`<div class="feedback ${state}">
    <strong>${my===undefined?'Tidak dijawab':ok?'Benar':'Kurang tepat'} · Kunci ${L4[q.a]}${q.sec==='W'?` · bagian "${opts[q.a]}"`:''}</strong>`;
  if(my!==undefined&&!ok)h+=`<div class="why no"><span class="label">Kenapa ${L4[my]} salah</span><p>${wrongNote(q,my)}</p></div>`;
  h+=`<div class="why ok"><span class="label">${ok?'Pembahasan':`Kenapa ${L4[q.a]} benar`}</span><p>${q.ex}</p></div>`;
  if(!ok){
    const others=[0,1,2,3].filter(k=>k!==q.a&&k!==my);
    h+=`<details class="others"><summary>Lihat alasan pilihan lainnya</summary><ul>${others.map(k=>`<li><b class="mono">${L4[k]}</b> ${q.sec==='W'?`"${opts[k]}"`:opts[k]} — ${wrongNote(q,k)}</li>`).join('')}</ul></details>`;
  }
  h+=`</div>`;
  if(tip)h+=`<div class="tip"><span class="label">Materi · ${tip[0]}</span><p>${tip[1]}</p></div>`;
  return h;
}

function renderTest(){
  const id=st.ids[st.cur], q=byId(id), n=st.cur+1, tot=st.ids.length;
  const locked=isLocked(id), my=st.ans[id], opts=optsOf(q);
  let body='';
  if(q.sec==='L'){
    const used=st.plays[id]||0, left=2-used, canPlay=st.mode==='prac'||st.done||left>0;
    body+=`<div class="audio ${playing?'playing':''}" id="audio">
      <button class="play" id="play" ${(!canPlay||!hasTTS)?'disabled':''}>
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">${playing?'<rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/>':'<path d="M8 5v14l11-7z"/>'}</svg>
        ${playing?'Hentikan':'Putar audio'}</button>
      <span class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
      <span class="note">${st.mode==='sim'&&!st.done?`Sisa putar: <span class="mono">${left}</span>`:'Putar sebanyak yang dibutuhkan'}${q.talk?' · Ceramah singkat':''}</span>
    </div>
    <div class="stem">${q.q}</div>`;
  }else if(q.sec==='S'){
    body+=`<div class="stem">${q.q.replace('___','<span class="blank"></span>')}</div>`;
  }else if(q.sec==='W'){
    body+=`<div class="stem">${renderWE(q.s)}</div>`;
  }else{
    const P=PASSAGES[q.p];
    body+=`<div class="passage" tabindex="0"><h3>${P.title}</h3>${P.paras.map((t,k)=>`<p><span class="pn">¶${k+1}</span>${t}</p>`).join('')}</div>
      <div class="stem">${q.q}</div>`;
  }
  body+=`<div class="opts" role="radiogroup">${opts.map((o,k)=>{
    let c='opt';
    if(locked){if(k===q.a)c+=' right';else if(k===my)c+=' wrong'}
    else if(k===my)c+=' sel';
    return `<button class="${c}" data-k="${k}" role="radio" aria-checked="${k===my}" ${locked?'disabled':''}><span class="bub">${L4[k]}</span><span class="${q.sec==='W'?'uline':''}">${o}</span></button>`}).join('')}</div>`;
  if(locked){body+=feedbackHTML(q,my);if(q.sec==='L')body+=transcript(q)}

  app.innerHTML=`
  <div class="bar">
    <div class="sec"><span class="label">${st.label} · Soal ${n} dari ${tot}</span><strong>${secTitle(q.sec)}</strong></div>
    <div class="row">

      <button class="btn ${confirmEnd?'danger':''}" id="end">${st.done?'Kembali ke hasil':confirmEnd?'Yakin selesai? Klik lagi':'Selesai'}</button>

    </div>

    <section class="qcard">
      <div class="qhead"><span class="qnum">No. ${n} · ${SEC[q.sec].name} · ${PACKS[q.pack].name}</span>
        ${st.mode==='sim'&&!st.done?`<button class="flag ${st.flags[id]?'on':''}" id="flag">${st.flags[id]?'Ditandai ragu':'Tandai ragu'}</button>`:''}</div>
      <div class="direction">${SEC[q.sec].dir}</div>
      ${body}
      <div class="nav">
        <button class="btn" id="prev" ${st.cur===0?'disabled':''}>← Sebelumnya</button>
        ${st.cur<tot-1?`<button class="btn primary" id="next">Berikutnya →</button>`:`<button class="btn primary" id="end2">${st.done?'Kembali ke hasil':'Lihat hasil'}</button>`}
      </div>
    </section>
    ${renderSheet()}
  </div>`;

function transcript(q){
  const nm={W:q.talk?'Lecturer':'Woman',M:q.talk?'Lecturer':'Man',N:'Narrator'};
  return `<div class="transcript"><span class="label">Transkrip audio</span>${q.audio.map(l=>`<div><b>${nm[l.who]}:</b> ${l.t}</div>`).join('')}</div>`;
}

function renderSheet(){
  const groups=[];
  st.ids.forEach((id,pos)=>{const s=byId(id).sec,g=s==='W'?'S':s;let G=groups.find(x=>x.g===g);if(!G){G={g,list:[]};groups.push(G)}G.list.push({id,pos})});
  const gname={L:'Section 1 · Listening',S:'Section 2 · Structure & WE',R:'Section 3 · Reading'};
  const answered=st.ids.filter(id=>st.ans[id]!==undefined).length;
  return `<aside class="sheet" aria-label="Lembar jawaban">
    <div class="sheet-head"><strong>LEMBAR JAWABAN</strong><span class="mono" style="font-size:13px">${answered}/${st.ids.length}</span></div>
    ${groups.map(G=>`<div class="grp"><span class="label">${gname[G.g]}</span><div class="cells">${G.list.map(({id,pos})=>{
      let c='cell';const a=st.ans[id];
      if(isLocked(id))c+=a===byId(id).a?' ok':' no';else if(a!==undefined)c+=' ans';
      if(pos===st.cur)c+=' cur';if(st.flags[id]&&!st.done)c+=' flg';
      return `<button class="${c}" data-go="${pos}" aria-label="Soal ${pos+1}">${a!==undefined&&!isLocked(id)?L4[a]:pos+1}</button>`}).join('')}</div></div>`).join('')}
    <div class="legend">${st.done||st.mode==='prac'?'<span><i></i>Kosong</span><span><i class="g"></i>Benar</span><span><i class="r"></i>Salah</span>':'<span><i></i>Kosong</span><span><i class="a"></i>Terisi</span><span><i class="f"></i>Ragu</span>'}</div>
  </aside>`;
}

function bindTest(){
  const id=st.ids[st.cur];
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.k));
  app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(+b.dataset.go));
  const $=x=>document.getElementById(x);
  $('prev').onclick=()=>go(st.cur-1);
  if($('next'))$('next').onclick=()=>go(st.cur+1);
  if($('end2'))$('end2').onclick=endClick;
  $('end').onclick=endClick;
  $('home').onclick=renderHome;
  if($('flag'))$('flag').onclick=()=>{st.flags[id]=!st.flags[id];renderTest()};
  if($('play'))$('play').onclick=togglePlay;
}
function endClick(){if(st.done){renderResult(st.result);return}if(!confirmEnd){confirmEnd=true;renderTest();setTimeout(()=>{if(confirmEnd&&st&&!st.done){confirmEnd=false;renderTest()}},4000);return}finish()}
function choose(k){const id=st.ids[st.cur];if(isLocked(id))return;st.ans[id]=k;confirmEnd=false;renderTest()}
function go(p){if(p<0||p>=st.ids.length)return;stopAudio();playing=false;confirmEnd=false;st.cur=p;renderTest();window.scrollTo({top:0})}
function togglePlay(){
  const id=st.ids[st.cur],q=byId(id);
  if(q.sec!=='L')return;
  if(playing){stopAudio();playing=false;renderTest();return}
  if(st.mode==='sim'&&!st.done&&(st.plays[id]||0)>=2)return;
  st.plays[id]=(st.plays[id]||0)+1;playing=true;renderTest();
  speak(q.audio,()=>{if(st&&st.ids[st.cur]===id){playing=false;renderTest()}else playing=false});
}

/* ================= SKOR ================= */
function finish(){
  stopAudio();playing=false;clearInterval(tick);
  if(st.done){renderResult(st.result);return}
  st.done=true;
  const cnt={L:[0,0],SW:[0,0],R:[0,0]};
  st.ids.forEach(id=>{const q=byId(id),k=q.sec==='S'||q.sec==='W'?'SW':q.sec;cnt[k][1]++;if(st.ans[id]===q.a)cnt[k][0]++});
  const range={L:[31,68],SW:[31,68],R:[31,67]}, scaled={};
  for(const k in cnt){if(cnt[k][1]){const [lo,hi]=range[k];scaled[k]=Math.round(lo+(cnt[k][0]/cnt[k][1])*(hi-lo))}}
  const full=['L','SW','R'].every(k=>cnt[k][1]>=10);
  const total=full?Math.round((scaled.L+scaled.SW+scaled.R)*10/3):null;
  const correct=st.ids.filter(id=>st.ans[id]===byId(id).a).length;
  const used=Math.floor((Date.now()-st.start)/1000);
  // perbarui daftar soal salah
  let wl=sget(WKEY,[]);
  st.ids.forEach(id=>{const ok=st.ans[id]===byId(id).a;if(ok)wl=wl.filter(x=>x!==id);else if(st.ans[id]!==undefined&&!wl.includes(id))wl.push(id)});
  sset(WKEY,wl);
  const h=sget(HKEY,[]);
  h.unshift({date:new Date().toLocaleDateString('id-ID',{day:'numeric',month:'short'}),label:st.label,score:full?total:`${correct}/${st.ids.length}`,ts:Date.now()});
  sset(HKEY,h.slice(0,8));
  st.result={cnt,scaled,total,correct,used};
  revFilter=correct<st.ids.length?'wrong':'all';
  renderResult(st.result);
}

function band(t){
  if(t>=627)return'Setara level C1 (mahir).';
  if(t>=543)return'Setara level B2. Umumnya memenuhi syarat beasiswa dan S2 dalam negeri (biasanya 500–550).';
  if(t>=460)return'Setara level B1. Cukup untuk banyak syarat kelulusan S1 (umumnya 450–500).';
  if(t>=337)return'Setara level A2. Fokuskan latihan pada grammar dasar dan kosakata.';
  return'Di bawah A2. Mulailah dari Structure dan pola kalimat dasar.';
}

function renderResult(r){
  window.scrollTo(0,0);
  const lab={L:'Listening',SW:'Structure & WE',R:'Reading'};
  const rows=Object.keys(r.scaled).map(k=>{const [c,t]=r.cnt[k];return `<div class="barrow"><span>${lab[k]}</span><div class="track"><div class="fill" style="width:${t?c/t*100:0}%"></div></div><span class="mono">${c}/${t} · ${r.scaled[k]}</span></div>`}).join('');
  const wrongIds=st.ids.filter(id=>st.ans[id]!==byId(id).a);
  // materi yang paling sering salah
  const tc={};wrongIds.forEach(id=>{const t=byId(id).t;if(t)tc[t]=(tc[t]||0)+1});
  const topics=Object.entries(tc).sort((a,b)=>b[1]-a[1]);
  const list=revFilter==='wrong'?wrongIds:st.ids;
  app.innerHTML=`
  <div class="result">
    <header class="masthead"><span class="formcode">HASIL · ${st.label.toUpperCase()} · WAKTU ${fmtTime(r.used)}</span><h1>Hasil ujian</h1></header>
    <section class="score">
      <div><span class="label">${r.total!==null?'Perkiraan skor ITP':'Jawaban benar'}</span><div class="big">${r.total!==null?r.total:r.correct+'/'+st.ids.length}</div></div>
      <div class="bars">${rows}
        <p class="note">${r.total!==null?band(r.total)+' ':''}Angka di kanan adalah skor skala per bagian. Ini perkiraan dari ${st.ids.length} soal, bukan skor resmi.</p></div>
    </section>
    <div class="row">
      ${wrongIds.length?`<button class="btn primary" id="redo">Latihan ulang ${wrongIds.length} soal salah</button>`:''}
      <button class="btn ${wrongIds.length?'':'primary'}" id="again">Paket baru${selPack==='x'?' (acak)':''}</button>
      <button class="btn" id="rev">Telusuri soal satu per satu</button>
      <button class="btn" id="home">Beranda</button>
    </div>
    ${topics.length?`<section class="panel"><span class="label">Materi yang perlu dipelajari</span>
      <div class="topics">${topics.map(([t,c])=>`<details class="topic"><summary><span>${TIPS[t][0]}</span><span class="mono cnt">${c} salah</span></summary><p>${TIPS[t][1]}</p></details>`).join('')}</div></section>`:''}
    <section class="review">
      <div class="row" style="justify-content:space-between"><span class="label">Pembahasan</span>
        <div class="chips sm"><button class="chip ${revFilter==='wrong'?'on':''}" data-f="wrong">Salah saja (${wrongIds.length})</button><button class="chip ${revFilter==='all'?'on':''}" data-f="all">Semua (${st.ids.length})</button></div></div>
      ${list.length?list.map(id=>{const pos=st.ids.indexOf(id),q=byId(id),my=st.ans[id],ok=my===q.a;
        const txt=q.sec==='W'?q.s.replace(/[{}]/g,''):q.q;
        return `<details ${!ok&&revFilter==='wrong'?'open':''}><summary><span class="mk ${my===undefined?'na':ok?'ok':'no'}">${pos+1}</span><span class="sum">${txt}</span><span class="tag hidden-sm">${SEC[q.sec].name.split(' ')[0]}</span></summary>
          <div class="body">
            ${q.sec==='W'?`<div class="stem sm">${renderWE(q.s)}</div>`:''}
            ${q.sec==='R'?`<div class="note">Bacaan: ${PASSAGES[q.p].title}</div>`:''}
            <div class="tag">Jawabanmu: <span class="${ok?'ok-t':'no-t'}">${my===undefined?'—':L4[my]+'. '+optsOf(q)[my]}</span> · Kunci: <span class="ok-t">${L4[q.a]}. ${optsOf(q)[q.a]}</span></div>
            ${feedbackHTML(q,my)}
            ${q.sec==='L'?transcript(q):''}
          </div></details>`}).join(''):'<p class="note">Semua jawaban benar. Tidak ada yang perlu diulang.</p>'}
    </section>
  </div>`;
  const $=x=>document.getElementById(x);
  const mode=st.mode;
  if($('redo'))$('redo').onclick=()=>startTest('prac',wrongIds,'Ulang soal salah');
  $('again').onclick=()=>{const secs=[...new Set(st.ids.map(id=>byId(id).sec))];startTest(mode,packSet(selPack,secs),packLabel(selPack)+(mode==='sim'?' · Simulasi':' · Latihan'))};
  $('home').onclick=renderHome;
  $('rev').onclick=()=>{st.cur=0;renderTest()};
  app.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{revFilter=b.dataset.f;renderResult(r)});
}

/* ================= EKSPOR / IMPOR PROGRES ================= */
function makeCode(){
  const data={v:1,h:sget(HKEY,[]),w:sget(WKEY,[]),p:selPack};
  return 'TOEFL1:'+btoa(unescape(encodeURIComponent(JSON.stringify(data))));
}
function readCode(txt){
  const m=String(txt||'').replace(/\s+/g,'').match(/^TOEFL1:([A-Za-z0-9+/=]+)$/);
  if(!m)return null;
  try{const d=JSON.parse(decodeURIComponent(escape(atob(m[1]))));
    if(!d||d.v!==1||!Array.isArray(d.h)||!Array.isArray(d.w))return null;return d}catch(e){return null}
}
function mergeProgress(d){
  const key=r=>[r.date,r.label,r.score].join('|');
  const mine=sget(HKEY,[]), seen=new Set(mine.map(key));
  const add=d.h.filter(r=>r&&r.label&&!seen.has(key(r)));
  const all=mine.concat(add).map((r,i)=>({r,i}));
  all.sort((a,b)=>(b.r.ts||0)-(a.r.ts||0)||a.i-b.i);
  sset(HKEY,all.map(x=>x.r).slice(0,8));
  const wl=sget(WKEY,[]);let nw=0;
  d.w.forEach(id=>{if(typeof id==='number'&&byId(id)&&!wl.includes(id)){wl.push(id);nw++}});
  sset(WKEY,wl);
  return {h:add.length,w:nw};
}
function bindSync(){
  const $=x=>document.getElementById(x);
  if(!$('exp-btn'))return;
  $('exp-btn').onclick=()=>{
    $('imp-box').hidden=true;$('exp-box').hidden=false;
    const ta=$('exp-code');ta.value=makeCode();
    const sel=()=>{ta.focus();ta.select()};
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(ta.value).then(()=>{$('exp-msg').textContent='Kode tersalin. Tempel di perangkat lain.'},()=>{sel();$('exp-msg').textContent='Kode sudah dipilih. Tekan Ctrl+C (atau tahan lalu Salin di HP).'});
    }else{sel();$('exp-msg').textContent='Kode sudah dipilih. Tekan Ctrl+C (atau tahan lalu Salin di HP).'}
  };
  $('imp-btn').onclick=()=>{$('exp-box').hidden=true;$('imp-box').hidden=false;$('imp-msg').textContent='';$('imp-code').focus()};
  $('imp-go').onclick=()=>{
    const d=readCode($('imp-code').value), msg=$('imp-msg');
    if(!d){msg.textContent='Kode tidak dikenali. Pastikan seluruh kode tersalin, diawali "TOEFL1:".';msg.className='note err';return}
    const r=mergeProgress(d);
    renderHome();
    const m=document.getElementById('imp-msg'), b=document.getElementById('imp-box');
    b.hidden=false;m.className='note ok-t';
    m.textContent=(r.h||r.w)?`Berhasil digabung: ${r.h} riwayat skor dan ${r.w} soal salah ditambahkan.`:'Kode valid, tapi semua progresnya sudah ada di perangkat ini.';
  };
}

/* ================= KEYBOARD ================= */
document.addEventListener('keydown',e=>{
  if(!st||e.ctrlKey||e.metaKey||e.altKey)return;
  if(!document.querySelector('.qcard'))return;
  const k=e.key.toLowerCase();
  if(k.length===1&&'abcd'.includes(k)){choose('abcd'.indexOf(k));return}
  if(e.key==='ArrowRight'){go(st.cur+1);return}
  if(e.key==='ArrowLeft'){go(st.cur-1);return}
  if(e.key===' '&&byId(st.ids[st.cur]).sec==='L'&&!e.target.closest('button,summary')){e.preventDefault();togglePlay()}
});

/* tombol Back di Android */
window.__back=function(){if(st){renderHome();window.scrollTo(0,0);return true}return false};

renderHome();
