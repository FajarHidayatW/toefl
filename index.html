<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#16805f"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="TOEFL ITP"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Simulasi TOEFL ITP</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Layout: lembar jawaban komputer (LJK) — soal di kiri, lembar bulatan jawaban di kanan; tinta "drop-out" hijau, isian pensil grafit */
:root{
  --paper:#f4f7f6; --card:#ffffff; --ink:#1b2422; --muted:#5d6966; --line:#d3dcd9;
  --drop:#16805f; --drop-soft:#e1f1ea; --graphite:#2a2e33; --on-graphite:#ffffff;
  --good:#2b7a3d; --good-soft:#e3f3e6; --bad:#b93a2e; --bad-soft:#fbe8e5; --warn:#a8660b;
  --f-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --f-read:"Source Serif 4",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#111614; --card:#18201d; --ink:#e4ebe8; --muted:#97a5a0; --line:#2b3632;
  --drop:#4dc39e; --drop-soft:#16302a; --graphite:#dde3e6; --on-graphite:#111614;
  --good:#74c886; --good-soft:#18301f; --bad:#f08072; --bad-soft:#3a1d19; --warn:#e3a54a; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111614; --card:#18201d; --ink:#e4ebe8; --muted:#97a5a0; --line:#2b3632;
  --drop:#4dc39e; --drop-soft:#16302a; --graphite:#dde3e6; --on-graphite:#111614;
  --good:#74c886; --good-soft:#18301f; --bad:#f08072; --bad-soft:#3a1d19; --warn:#e3a54a; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:1120px;margin:0 auto;padding-block:20px 48px}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.2}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible{outline:2px solid var(--drop);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.label{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.btn{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:9px 16px;font-weight:500}
.btn:hover{border-color:var(--drop)}
.btn.primary{background:var(--drop);border-color:var(--drop);color:var(--card)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
kbd{font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--card)}

/* HOME */
.home{display:grid;gap:28px}
.masthead{display:grid;gap:10px;padding-block:12px 4px;border-bottom:2px solid var(--drop)}
.masthead h1{font-size:clamp(28px,4.4vw,42px);font-weight:700;letter-spacing:-.01em}
.masthead p{margin:0;color:var(--muted);max-width:62ch}
.formcode{font-family:var(--f-mono);font-size:12px;color:var(--drop);letter-spacing:.06em}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:20px;display:grid;gap:14px;align-content:start;min-width:0}
.panel h2{font-size:19px}
.panel p{margin:0;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fmt{width:100%;border-collapse:collapse;font-size:14px}
.fmt th,.fmt td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
.fmt th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.fmt td.n{font-family:var(--f-mono);text-align:right}
.hist{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.hist li{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed var(--line);padding-block:6px;font-size:14px}
.hist .sc{font-family:var(--f-mono);font-weight:600;color:var(--drop)}
.keys{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted)}

/* TEST */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding-block:12px;border-bottom:1px solid var(--line);margin-bottom:20px}
.bar .sec{display:grid;gap:2px}
.bar .sec strong{font-size:16px}
.timer{font-family:var(--f-mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;padding:4px 12px;border:1.5px solid var(--ink);border-radius:6px}
.timer.low{color:var(--bad);border-color:var(--bad)}
.test{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
@media (max-width:860px){.test{grid-template-columns:minmax(0,1fr)}}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:22px;display:grid;gap:18px;min-width:0}
.qhead{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.qnum{font-family:var(--f-mono);font-weight:600;font-size:14px;color:var(--drop)}
.direction{font-size:13px;color:var(--muted);border-left:3px solid var(--drop);padding-left:10px}
.stem{font-size:18px;line-height:1.6}
.blank{display:inline-block;min-width:5.5em;border-bottom:2px solid var(--ink);margin:0 2px}
.u{position:relative;display:inline-block;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px;margin-bottom:16px}
.u::after{content:attr(data-l);position:absolute;left:50%;transform:translateX(-50%);top:1.55em;font-family:var(--f-mono);font-size:11px;font-weight:600;color:var(--drop)}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:14px;align-items:center;text-align:left;width:100%;background:transparent;border:1px solid var(--line);border-radius:8px;padding:10px 14px;min-height:48px}
.opt:hover:not(:disabled){border-color:var(--drop);background:var(--drop-soft)}
.bub{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--drop);color:var(--drop);display:grid;place-items:center;font-family:var(--f-mono);font-size:13px;font-weight:600}
.opt.sel .bub{background:var(--graphite);border-color:var(--graphite);color:var(--on-graphite)}
.opt.sel{border-color:var(--graphite)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .bub{background:var(--good);border-color:var(--good);color:var(--card)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .bub{background:var(--bad);border-color:var(--bad);color:var(--card)}
.opt:disabled{cursor:default}
.opt .uline{text-decoration:underline;text-underline-offset:3px}
.feedback{border-radius:8px;padding:14px 16px;display:grid;gap:6px;font-size:14px}
.feedback.ok{background:var(--good-soft)}
.feedback.no{background:var(--bad-soft)}
.feedback strong{font-size:15px}
.audio{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:14px;border:1px dashed var(--drop);border-radius:8px;background:var(--drop-soft)}
.play{display:flex;align-items:center;gap:10px;border:none;background:var(--drop);color:var(--card);border-radius:999px;padding:9px 18px 9px 12px;font-weight:600}
.play:disabled{opacity:.45;cursor:not-allowed}
.play svg{width:20px;height:20px}
.wave{display:flex;gap:3px;align-items:end;height:18px}
.wave i{width:3px;background:var(--drop);border-radius:2px;height:4px}
.playing .wave i{animation:w .9s ease-in-out infinite}
.wave i:nth-child(2){animation-delay:.15s}.wave i:nth-child(3){animation-delay:.3s}.wave i:nth-child(4){animation-delay:.45s}.wave i:nth-child(5){animation-delay:.6s}
@keyframes w{0%,100%{height:4px}50%{height:18px}}
@media (prefers-reduced-motion:reduce){.playing .wave i{animation:none;height:12px}}
.transcript{font-size:14px;display:grid;gap:4px;background:var(--paper);border-radius:6px;padding:12px}
.transcript b{font-family:var(--f-mono);font-size:12px;color:var(--drop)}
.passage{font-family:var(--f-read);font-size:16.5px;line-height:1.7;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:16px 18px;max-height:46vh;overflow:auto;display:grid;gap:12px}
.passage h3{font-family:var(--f-ui);font-size:14px}
.passage p{margin:0;max-width:68ch}
.passage .pn{font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-right:6px}
.nav{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.flag{border:1px solid var(--line);background:transparent;border-radius:6px;padding:5px 10px;font-size:13px}
.flag.on{border-color:var(--warn);color:var(--warn)}

/* LJK SHEET */
.sheet{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;display:grid;gap:14px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 78px)}
@media (max-width:860px){.sheet{position:static}}
.sheet-head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--drop);padding-bottom:8px}
.sheet-head strong{color:var(--drop);font-size:14px;letter-spacing:.04em}
.grp{display:grid;gap:6px}
.cells{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.cell{position:relative;border:1.5px solid var(--drop);background:transparent;color:var(--drop);border-radius:50%;aspect-ratio:1;max-width:100%;font-family:var(--f-mono);font-size:12px;font-weight:600;display:grid;place-items:center;padding:0}
.cell.ans{background:var(--graphite);border-color:var(--graphite);color:var(--on-graphite)}
.cell.cur{outline:2px solid var(--drop);outline-offset:2px}
.cell.ok{background:var(--good);border-color:var(--good);color:var(--card)}
.cell.no{background:var(--bad);border-color:var(--bad);color:var(--card)}
.cell.flg::after{content:"";position:absolute;top:-2px;right:-2px;width:8px;height:8px;border-radius:50%;background:var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--drop)}
.legend i.a{background:var(--graphite);border-color:var(--graphite)}
.legend i.f{background:var(--warn);border-color:var(--warn)}

/* RESULT */
.result{display:grid;gap:24px}
.score{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:24px}
@media (max-width:600px){.score{grid-template-columns:1fr}}
.big{font-family:var(--f-mono);font-size:clamp(52px,9vw,76px);font-weight:600;line-height:1;color:var(--drop);font-variant-numeric:tabular-nums}
.bars{display:grid;gap:12px;min-width:0}
.barrow{display:grid;grid-template-columns:minmax(0,150px) 1fr auto;gap:12px;align-items:center;font-size:14px}
.track{height:10px;background:var(--paper);border:1px solid var(--line);border-radius:999px;overflow:hidden}
.fill{height:100%;background:var(--drop)}
.note{font-size:13px;color:var(--muted);margin:0}
.review{display:grid;gap:8px}
.review details{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 16px}
.review summary{display:flex;gap:12px;align-items:center;cursor:pointer;list-style:none}
.review summary::-webkit-details-marker{display:none}
.review .mk{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--card)}
.review .mk.ok{background:var(--good)}.review .mk.no{background:var(--bad)}.review .mk.na{background:var(--muted)}
.review .sum{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.review .body{display:grid;gap:8px;padding-top:12px;font-size:14px}
.tag{font-family:var(--f-mono);font-size:12px}
.ok-t{color:var(--good)}.no-t{color:var(--bad)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:7px 16px;font-weight:500}
.chip:hover{border-color:var(--drop)}
.chip.on{background:var(--drop);border-color:var(--drop);color:var(--card)}
.chips.sm .chip{padding:4px 12px;font-size:13px}
.feedback.na{background:var(--paper);border:1px solid var(--line)}
.why{display:grid;gap:2px}
.why p{margin:0}
.why.no .label{color:var(--bad)}
.why.ok .label{color:var(--good)}
.others summary{cursor:pointer;font-size:13px;color:var(--muted)}
.others ul{margin:6px 0 0;padding-left:18px;display:grid;gap:4px}
.tip{border:1px solid var(--drop);border-left-width:4px;border-radius:6px;padding:12px 14px;display:grid;gap:4px;font-size:14px}
.tip .label{color:var(--drop)}
.tip p{margin:0;max-width:72ch}
.topics{display:grid;gap:6px}
.topic{border-bottom:1px solid var(--line);padding-block:6px}
.topic summary{display:flex;justify-content:space-between;gap:12px;cursor:pointer;font-weight:500}
.topic .cnt{color:var(--bad);font-size:13px;flex:none}
.topic p{margin:6px 0 4px;font-size:14px;color:var(--muted);max-width:72ch}
.legend i.g{background:var(--good);border-color:var(--good)}
.legend i.r{background:var(--bad);border-color:var(--bad)}
.stem.sm{font-size:16px}
@media (pointer:coarse){.keys{display:none}}
.cell.off{opacity:.3;cursor:not-allowed}
@media (min-width:861px){.sheet{max-height:calc(100vh - 100px);overflow-y:auto;overscroll-behavior:contain}}
.intro{display:grid;gap:20px;max-width:760px}
.facts{display:flex;flex-wrap:wrap;gap:32px}
.facts div{display:grid;gap:2px}
.facts strong{font-size:26px;color:var(--drop)}
.note.err{color:var(--bad)}
.hidden-sm{}
@media (max-width:520px){.hidden-sm{display:none}.stem{font-size:17px}.qcard{padding:16px}}
</style>

</head><body><div class="wrap" id="app"></div>

<script>
/* ================= MATERI SINGKAT ================= */
const TIPS={
 'l-correction':['Koreksi informasi','Kata "Actually…", "Not exactly…", "In fact…" menandakan pembicara kedua mengoreksi anggapan pembicara pertama. Jawabannya biasanya informasi baru dari pembicara kedua.'],
 'l-but':['Pola "…, but …"','Bagian setelah "but" adalah inti jawaban. "I\'d love to, but…" atau "I was going to, but…" berarti tidak jadi atau tidak bisa.'],
 'l-suggest':['Ungkapan saran','"Why don\'t you…", "Why not…", "How about…", "Did you check…?", "I\'d … instead" adalah saran. Pertanyaan "What does the man suggest?" mencari isi saran itu.'],
 'l-echo':['Jebakan kata yang sama','Pilihan yang memakai kata persis dari audio sering justru salah. Jawaban benar biasanya memakai sinonim atau parafrase.'],
 'l-implied':['Makna tersirat','Pembicara sering tidak menjawab langsung. Simpulkan dari alasan, kebiasaan, atau saran yang ia sebut ("That\'s why…", "I wouldn\'t go out without…").'],
 'l-plan':['Rencana dan niat','"Not yet, but I\'m planning to…", "I\'m going to…", "I intend to…" menunjukkan sesuatu yang belum terjadi tapi akan dilakukan.'],
 'l-main':['Topik utama ceramah','Ide pokok hampir selalu disebut di awal ("Today we\'ll look at…"). Nama tokoh, angka, atau contoh di akhir biasanya hanya detail pendukung.'],
 'l-detail':['Detail yang disebut','Untuk "According to the speaker…", cocokkan dengan kalimat spesifik di audio. Waspadai pilihan yang mencampur dua detail berbeda.'],
 'l-agree':['Ungkapan setuju','"So do I / So did I", "Me too", "Neither do I", "You can say that again", "Tell me about it" berarti setuju dengan pembicara sebelumnya.'],
 'l-idiom':['Idiom percakapan','Idiom tidak diartikan harfiah. "You can say that again" = sangat setuju. "Do you mind…?" dijawab "Not at all" = boleh. "I could hardly keep my eyes open" = sangat bosan/mengantuk. "Don\'t count on it" = jangan berharap. "In a heartbeat" = tanpa ragu.'],
 'l-condition':['Pengandaian dan penyesalan','"I would if I had…" berarti kenyataannya tidak. "I wish I hadn\'t…" berarti menyesal sudah melakukannya. Maknanya kebalikan dari bentuk kalimatnya.'],
 'l-negative':['Kata bermakna negatif','"Hardly", "rarely", "barely", "seldom" berarti hampir tidak. "Hardly anyone deserved it more" = dialah yang paling layak. Negatif + comparative bermakna sangat positif: "Couldn\'t be better" = sangat baik.'],
 'sva':['Subject–verb agreement','Kata kerja mengikuti subjek inti, bukan kata benda di frasa sisipan. Each / every / the number of / neither of → tunggal. Subjek gabungan "A and B" → jamak. Pada either…or dan neither…nor, ikuti subjek yang paling dekat.'],
 'inversion':['Inversi','Jika kalimat dibuka kata negatif atau terbatas (Not until, Only after, Rarely, Seldom, Never, Not only), urutannya menjadi auxiliary + subjek + verb. Contoh: "Rarely have I seen…", "Not only does she…".'],
 'appositive':['Appositive','Frasa benda di antara koma yang menjelaskan subjek, tanpa kata kerja: "Jakarta, the capital of Indonesia, is…". Jika memakai who/which, klausanya harus punya kata kerja.'],
 'comparative':['Perbandingan','Comparative: -er / more + than. Superlative: the + -est / most. Pola paralel: "The more…, the more…". Jangan menggandakan, misalnya "more larger".'],
 'participle':['Participle sebagai keterangan','Past participle (V3) bermakna pasif: "Founded in 1636, Harvard…", "The bridge built last year…". Present participle (V-ing) bermakna aktif.'],
 'so-such':['So / such … that','so + adjective/adverb + that, misalnya "so quickly that". such + (a) + adjective + noun + that, misalnya "such a fast plant that".'],
 'conjunction':['Konjungsi vs preposisi','Konjungsi (although, because, until, while) diikuti klausa S + V. Preposisi (despite, in spite of, because of, during) diikuti kata benda atau V-ing. Although dan but tidak dipakai bersamaan.'],
 'subjunctive':['Subjunctive','Setelah "it is essential/important/necessary that" atau "suggest/recommend/insist that", pakai bentuk dasar verb untuk semua subjek: "that he submit".'],
 'missing-verb':['Kalimat tanpa kata kerja','Setiap kalimat butuh subjek dan kata kerja utama. Cek dulu apakah kalimat sudah punya verb. V-ing atau to-infinitive saja tidak bisa menjadi verb utama.'],
 'preposition':['Preposisi pembanding','"Unlike / Like + noun" dipakai untuk membandingkan. "Alike" adalah adjective/adverb dan tidak diikuti noun ("They look alike").'],
 'parallel':['Paralelisme','Unsur dalam daftar atau yang dihubungkan and/or/but harus sejenis: noun–noun–noun, V-ing–V-ing, verb lampau–verb lampau.'],
 'wordform':['Bentuk kata','Adjective menerangkan noun (a successful flight). Adverb menerangkan verb (explained clearly). "Interesting" = menarik (sifat sesuatu), "interested" = tertarik (perasaan orang).'],
 'countable':['Uncountable noun','Information, equipment, furniture, advice, news, luggage tidak punya bentuk jamak dan memakai verb tunggal. Sebaliknya, "one of the" selalu diikuti noun jamak.'],
 'pronoun':['Kasus pronoun','Setelah preposisi (between, for, with, to) pakai object pronoun: me, him, her, us, them. Jadi "between you and me".'],
 'tense':['Tenses','Present perfect: have/has + V3 (has flown). Past perfect: had + V3 untuk kejadian sebelum kejadian lampau lain ("By the time we arrived, the film had started"). Durasi memakai "for", titik waktu memakai "since".'],
 'gerund-inf':['Gerund dan infinitive','Gerund (V-ing) bisa menjadi subjek ("Managing time is…") dan dipakai setelah preposisi (look forward to visiting, excited about opening). Pola ask/tell/want + objek + to + verb.'],
 'conditional':['Kalimat pengandaian','Type 1: If + present, will + V ("If it rains, …"). Type 2: If + past, would + V ("If I had time, I would…"). Type 3 (masa lalu yang tidak terjadi): If + had + V3, would have + V3. Klausa "if" tidak memakai will.'],
 'noun-clause':['Noun clause','Klausa yang diawali what, that, whether, atau how bisa menjadi subjek. "What is known about Majapahit comes from…": "What is known…" adalah subjek dari verb "comes".'],
 'relative':['Relative pronoun','Who untuk orang (subjek), whom untuk orang (objek), which untuk benda, whose untuk kepemilikan. Klausa relatif harus punya verb sendiri.'],

const PASSAGES={
 borobudur:{title:'Borobudur',paras:[
  "Borobudur, located in Central Java, is the largest Buddhist monument in the world. It was built during the eighth and ninth centuries under the Sailendra dynasty. The monument consists of nine stacked platforms: six square ones at the base and three circular ones above them, crowned by a large central stupa. Its walls and balustrades are decorated with 2,672 relief panels and 504 statues of the Buddha. Pilgrims traditionally walked around each level in a clockwise direction, so that the carved stories unfolded in order as they climbed toward the top.",
  "For several centuries the monument was abandoned. Volcanic ash and jungle growth slowly covered it, and it was largely forgotten by the outside world. In 1814, Sir Thomas Stamford Raffles, then the British lieutenant-governor of Java, learned of its existence and sent an engineer to investigate. Clearing the site took weeks of work. A major restoration supported by UNESCO took place between 1975 and 1982, and in 1991 Borobudur was listed as a World Heritage Site. Today it is one of Indonesia's most visited attractions."]},
 mangrove:{title:'Mangrove Forests',paras:[
  "Mangroves are trees and shrubs that grow along tropical and subtropical coastlines, in the zone where land meets the sea. They can survive in salty water that would kill most other plants, and many species have special roots that rise above the mud to take in air during high tide.",
  "These forests provide important benefits to coastal communities. Their dense roots trap sediment and reduce the force of waves, which helps protect shorelines from erosion and storms. They also serve as nurseries where young fish, crabs, and shrimp can grow safely before moving to the open sea. In addition, mangrove soils store large amounts of carbon, which makes these forests valuable in the fight against climate change.",
  "Indonesia has more mangrove forest than any other country. However, large areas have been cleared over recent decades, mainly to make room for fish and shrimp ponds, as well as for coastal development. Many local governments and communities now run replanting programs, although scientists point out that restored forests may take many years to provide the full benefits of the original ones."]},
 batik:{title:'Batik',paras:[
  "Batik is a technique of decorating cloth by applying wax to the parts that should not absorb dye. Craftspeople traditionally use a small copper tool called a canting to draw lines of hot wax by hand. After the cloth is dyed, the wax is removed, revealing the pattern underneath. Because the process may be repeated several times with different colors, a single piece of hand-drawn batik can take weeks or even months to complete. A faster method uses a copper stamp, known as a cap, to print the wax onto the fabric.",
  "Batik designs often carry meaning. In the royal courts of Yogyakarta and Surakarta, certain patterns, such as parang, were once reserved for members of the nobility. Batik from coastal towns like Pekalongan, by contrast, tends to use brighter colors and shows influences from Chinese, Arab, and European traders who visited these ports. In 2009, UNESCO recognized Indonesian batik as part of the Intangible Cultural Heritage of Humanity, and October 2 is now celebrated as National Batik Day."]},
 sleep:{title:'Sleep and Memory',paras:[
  "Many students believe that staying up all night is the best way to prepare for an exam. Research on sleep, however, suggests the opposite. While we sleep, the brain does not simply rest. It replays and organizes information gathered during the day, a process scientists call memory consolidation. During deep sleep, new memories appear to be transferred from the hippocampus, a region that stores information temporarily, to other parts of the brain where they can be kept for a longer time.",
  "Experiments have shown that people who sleep after learning a list of words remember more of them the next day than people who stay awake for the same amount of time. Lack of sleep also reduces attention and makes it harder to learn new material in the first place. For these reasons, health experts recommend that adults sleep at least seven hours a night. They also advise avoiding bright screens before bed, since the light can delay the release of melatonin, a hormone that helps the body prepare for sleep."]},
 rafflesia:{title:'Rafflesia',paras:[
  "Rafflesia arnoldii, found in the rainforests of Sumatra and Borneo, produces the largest single flower in the world. A fully open bloom can measure nearly one meter across and weigh several kilograms. The plant is unusual in another way as well: it has no leaves, stems, or true roots. Instead, it lives as a parasite inside a type of tropical vine, taking all of its water and nutrients from its host.",
  "For most of its life the plant is invisible, growing as thin threads within the vine. Eventually a bud breaks through the bark and slowly swells over a period of several months. When the flower finally opens, it gives off a strong smell similar to rotting meat. This odor attracts flies, which carry pollen from one flower to another. The bloom lasts only about a week before it turns black and collapses. Because the plant depends on a specific host and on forest habitat, it is threatened by deforestation."]},
 krakatau:{title:'The 1883 Eruption of Krakatau',paras:[
  "In August 1883, the volcanic island of Krakatau, located in the Sunda Strait between Java and Sumatra, erupted with tremendous force. The final explosions were so loud that they were heard on an island in the Indian Ocean nearly 4,800 kilometers away. Most of the island disappeared, and the eruption generated huge waves, or tsunamis, that struck the coasts of Java and Sumatra. More than 36,000 people lost their lives, most of them because of the waves rather than the eruption itself.",
  "The effects of the disaster were felt around the world. Fine ash and gases rose high into the atmosphere, where they blocked part of the sunlight. As a result, average global temperatures dropped slightly for several years. People in Europe and North America reported unusually red and colorful sunsets. In 1927, a new volcano began to rise from the sea where Krakatau had been. Named Anak Krakatau, or \"Child of Krakatau,\" it remains active today."]},
 orangutan:{title:'Orangutans',paras:[
  "Orangutans are great apes found only on the islands of Borneo and Sumatra. Their name comes from Malay words meaning \"person of the forest.\" Orangutans spend most of their lives in trees, where they find fruit, leaves, and insects to eat. Each night, an adult orangutan builds a new nest high in the branches by bending and weaving leafy branches together.",
  "Orangutans have one of the slowest reproduction rates of any mammal. A female usually gives birth only once every seven or eight years. The young orangutan stays with its mother for several years, learning which plants are safe to eat and how to build nests. Because of this slow rate, populations recover very slowly when their numbers fall. The greatest threat to orangutans is the loss of forest habitat, which is cleared for farming, plantations, and logging. Three species are now recognized, and all of them are listed as critically endangered."]},
 gardencity:{title:'The Garden City',paras:[
  "At the end of the nineteenth century, many industrial cities in Britain were crowded, polluted, and unhealthy. In 1898, a British reformer named Ebenezer Howard proposed a solution in a book later published as Garden Cities of To-morrow. Howard imagined new towns that would combine the advantages of the city, such as jobs and culture, with the advantages of the countryside, such as fresh air and open space.",
  "In Howard's plan, each garden city would have a fixed population of about 32,000 people. The town would be arranged in a circular pattern, with a central park surrounded by public buildings, homes, and wide avenues. Factories would be placed at the edge of the town, and the whole settlement would be surrounded by a permanent belt of farmland. When a town reached its limit, a new garden city would be built nearby instead of letting the first one grow larger. Two towns were built on these principles in England: Letchworth, begun in 1903, and Welwyn Garden City, begun in 1920. Howard's ideas later influenced the planning of new towns in many countries."]},
 subak:{title:'Subak',paras:[
  "In Bali, rice farmers have managed water through a system called subak for more than a thousand years. A subak is a community of farmers who share water from a single source, such as a spring or a river. The water flows through a network of canals, tunnels, and small dams, and it is divided among the rice terraces according to rules agreed upon by the members.",
  "The system is closely connected to Balinese religious life. Water temples are located at springs, at lakes, and along the canals, and priests and farmers meet at these temples to decide when to plant and how to share water. By coordinating planting schedules, neighboring fields can be flooded or left dry at the same time, which helps reduce pests. In 2012, UNESCO listed the cultural landscape of Bali, including the subak system, as a World Heritage Site."]},
 gutenberg:{title:"Gutenberg's Printing Press",paras:[
  "Before the fifteenth century, books in Europe were copied by hand, usually by monks or professional scribes. A single book could take months to produce, so books were rare and expensive. Around 1440, Johannes Gutenberg, a goldsmith from the German city of Mainz, developed a printing system that changed this situation. His key idea was movable metal type: individual letters cast in metal that could be arranged into pages, printed, and then rearranged for new pages. He also developed an oil-based ink that stuck well to metal, and he adapted a press similar to those used to make wine.",
  "Gutenberg's most famous work, a Bible printed around 1455, showed that printed books could be as beautiful as handwritten ones. The new technology spread quickly. By 1500, printing shops were operating in more than 200 European cities, and millions of books had been produced. Because books became cheaper, more people learned to read, and new ideas in science and religion could travel faster than ever before."]}
};

LG('p1b1','B','Listen to a conversation between two students.',[
 "M:Hi, Lisa. I haven't seen you at the dining hall lately. Where have you been?",
 "W:I started a part-time job at the library. I work at the front desk four evenings a week.",
 "M:Four evenings? How do you find time to study?",
 "W:Actually, that's the best part. When it's quiet, my supervisor lets me do my homework at the desk. Most nights only a few people come in after eight o'clock.",
 "M:That sounds perfect. Is the library hiring anyone else? I need to earn some money for my books next semester.",
 "W:I think so. They're looking for someone to help shelve books on weekend mornings. You should fill out an application at the student employment office.",
 "M:Weekend mornings aren't my favorite, but I'll take it if I can get it. Thanks, Lisa."]);
LG('p1b2','B','Listen to a conversation between two students in a geology class.',[
 "W:Are you going on the geology field trip to the river canyon on Saturday?",
 "M:I signed up, but I'm a little worried. I heard we have to hike about eight kilometers.",
 "W:That's right, but the trail is mostly flat. The hardest part is the climb back up to the bus at the end of the day.",
 "M:What should I bring? The professor didn't give us a list.",
 "W:My roommate went last year. She said to bring plenty of water, a hat, and a notebook. Professor Hill expects everyone to sketch the rock layers in the canyon walls.",
 "M:Sketch them? I'm terrible at drawing.",
 "W:Don't worry. She said he cares more about the labels than about the artwork. You just have to identify each layer correctly.",
 "M:Well, that's a relief. Maybe I'll review the chapter on sedimentary rock before Saturday."]);
LG('p1c1','C','Listen to part of a lecture in an astronomy class.',[
 "W:Today I want to correct a common mistake about the seasons. Many people believe that summer happens when the Earth is closest to the Sun. In fact, the Earth is closest to the Sun in early January, which is winter in the Northern Hemisphere. The real cause of the seasons is the tilt of the Earth's axis, which is about twenty-three and a half degrees. As the Earth travels around the Sun, the Northern Hemisphere is tilted toward the Sun for part of the year. During that time, sunlight hits it more directly, and the days are longer, so temperatures rise. Six months later, the Northern Hemisphere is tilted away from the Sun, and it receives less direct light. Countries near the equator, like Indonesia, receive fairly direct sunlight all year, so they don't have strong seasonal changes in temperature."]);
LG('p1c2','C','Listen to part of a lecture in a psychology class.',[
 "M:In today's class, we'll look at a learning strategy called spaced practice. Imagine two students preparing for a vocabulary test. The first student studies for three hours the night before the test. The second student studies for the same total time, but she divides it into six thirty-minute sessions over two weeks. Research has shown again and again that the second student will usually remember much more, especially weeks or months later. This is called the spacing effect. It was first described in the 1880s by the German psychologist Hermann Ebbinghaus, who tested his own memory using lists of nonsense syllables. One explanation is that each time we return to information after a break, we have to work a little harder to recall it, and that effort makes the memory stronger. So, for your next exam, don't wait until the last night."]);

extendPassage('borobudur',"Borobudur also faces modern challenges. The large number of visitors has worn down some of the stone steps, and in 2010 ash from the eruption of nearby Mount Merapi covered the monument, forcing it to close for several weeks while workers cleaned the stones by hand. To protect the structure, authorities have limited the number of people who may climb to the upper levels each day and have introduced special sandals for visitors.");
extendPassage('mangrove',"Some communities have found ways to earn money from healthy mangrove forests. In parts of Java and Bali, villagers guide visitors along wooden walkways through the forest, and others make syrup, snacks, and natural dyes from mangrove fruits and bark. These activities give local people a reason to protect the trees rather than cut them down.");
addPassage('monarch','The Monarch Migration',[
 "Every autumn, millions of monarch butterflies in eastern North America begin one of the most remarkable journeys in the animal world. Traveling as far as 4,000 kilometers, they fly from Canada and the northern United States to a small area of mountain forests in central Mexico. There they gather by the millions on the branches of fir trees, so densely that the branches sometimes bend under their weight. They remain in these forests through the winter, when cool temperatures slow their bodies down and help them save energy.",
 "What makes the migration especially puzzling is that no single butterfly completes the entire round trip. The monarchs that fly south in autumn are born in late summer and live for up to eight or nine months, much longer than the summer generations, which survive only two to six weeks. In spring, these long-lived butterflies leave Mexico and fly north, laying eggs on milkweed plants along the way. Their children and grandchildren continue the journey, and it usually takes three or four generations to reach Canada again. Scientists believe the butterflies use the position of the sun, together with an internal clock, to find their direction, but how they locate the same forests year after year is still not fully understood.",
 "In recent decades, the number of monarchs reaching Mexico has fallen sharply. Researchers point to several causes, including the loss of the milkweed plants that caterpillars depend on for food, the cutting of forests in Mexico, and extreme weather. Many communities in North America now encourage people to plant milkweed in their gardens to help the species recover."]);
addPassage('jazz','The Birth of Jazz',[
 "Jazz is often called the first truly American art form. It developed in the early twentieth century in New Orleans, a port city where African, Caribbean, European, and American musical traditions mixed. Musicians combined the rhythms of African music, the harmonies of European church music, and the emotional style of the blues, a type of song that expressed the hardships of African American life in the South.",
 "One of the most important features of jazz is improvisation, which means that musicians create new melodies while they are performing instead of reading every note from written music. A jazz band might begin by playing a familiar tune together. Then each musician takes a turn, called a solo, inventing variations on the melody while the others accompany him or her. Because of improvisation, no two performances of the same piece are exactly alike. The trumpet player Louis Armstrong, who grew up in New Orleans, became famous in the 1920s for his inventive solos and his warm, rough singing voice, and he helped make the soloist the center of jazz performance.",
 "During the 1920s, many musicians moved north to cities such as Chicago and New York, and jazz spread quickly through records and radio broadcasts. The period became known as the Jazz Age. In later decades, jazz continued to change, giving rise to styles such as swing, bebop, and cool jazz. Today it is performed and studied around the world, including at the annual Java Jazz Festival in Jakarta."]);
addPassage('cactus','Life in the Desert',[
 "Deserts receive less than 250 millimeters of rain a year, yet many plants manage to survive there. Cacti, which are native to the Americas, are among the best-adapted desert plants. Most cacti have no true leaves. Instead, their leaves have changed over time into sharp spines. The spines reduce the amount of water the plant loses, and they also protect it from animals that might otherwise eat its juicy stem. In addition, the spines create a thin layer of still air around the plant, which provides some shade and slows evaporation.",
 "Because they have no leaves, cacti carry out photosynthesis in their thick green stems. These stems also act as storage tanks. Many cacti have folds, like the pleats of an accordion, that allow the stem to expand when water is available and shrink during dry periods. The giant saguaro cactus of Arizona, which can grow more than 12 meters tall, can absorb hundreds of liters of water after a single heavy rain.",
 "Cacti have also developed a special way of breathing. Most plants open the tiny pores on their surfaces during the day to take in carbon dioxide. Cacti open their pores only at night, when the air is cooler and less water escapes. They store the carbon dioxide and use it for photosynthesis the following day. Their roots are usually shallow but spread widely just below the surface, so they can quickly collect water from even a light rain."]);

LG('p2b1','B','Listen to a conversation between a student and a professor.',[
 "W:Excuse me, Professor Martin. Do you have a minute? I'm thinking about dropping your statistics course.",
 "M:Of course, come in. What seems to be the problem?",
 "W:I failed the first quiz, and I'm worried it will ruin my grade point average. I need good grades to keep my scholarship.",
 "M:I understand. But remember, the first quiz is worth only five percent of your final grade. Many students struggle at the beginning because the ideas are new.",
 "W:I didn't know it was worth so little.",
 "M:It's in the syllabus. Also, the deadline to drop a course without a penalty isn't until the end of next month. Why don't you come to the free tutoring sessions on Wednesday evenings and see how the next quiz goes? You can decide after that.",
 "W:That sounds reasonable. I'll try the tutoring first."]);
LG('p2b2','B','Listen to a conversation between two students in a dormitory.',[
 "M:Did you see the new bins in the hallway? There are three of them now instead of one.",
 "W:Yes, it's part of the new recycling program. The blue one is for paper, the green one is for plastic and cans, and the black one is for everything else.",
 "M:That seems complicated. What happens if someone puts something in the wrong bin?",
 "W:The student environmental club checks the bins once a week. If too many things are in the wrong place, they'll put up reminder signs on each floor.",
 "M:Is the university doing this to save money?",
 "W:Partly. The city charges less to collect recycled materials than regular trash. But mostly it's because the university wants to cut its waste in half within five years.",
 "M:In half? That's ambitious. Well, I guess I'd better start sorting my soda cans."]);
LG('p2c1','C','Listen to part of a talk in a business class.',[
 "M:Every time you buy something at a supermarket, the cashier scans a small pattern of black and white lines. This is the barcode, and it has an interesting history. The idea came from two graduate students, Norman Woodland and Bernard Silver, in the late 1940s. Woodland was inspired by Morse code. He later said he drew the dots and dashes in the sand at the beach and then pulled them downward with his fingers to make thin and thick lines. The two men received a patent in 1952, but the technology to read the codes quickly and cheaply didn't exist yet. It wasn't until the 1970s, when lasers and computers became affordable, that stores began using barcodes. The first product ever scanned in a store was a pack of chewing gum, in Ohio, in 1974. Today, barcodes help stores keep track of their goods automatically."]);
LG('p2c2','C','Listen to part of a lecture in a linguistics class.',[
 "W:There are about seven thousand languages spoken in the world today, but linguists estimate that nearly half of them could disappear by the end of this century. A language becomes endangered when children stop learning it at home. This often happens when families move to cities, or when a different language is needed for school and work. Indonesia is a good example of linguistic diversity. More than seven hundred languages are spoken there, though many have only a few thousand speakers. To protect these languages, researchers record elderly speakers, create dictionaries, and help communities teach the languages in local schools. When a language disappears, we lose more than words. We also lose stories, songs, and knowledge about local plants and animals that may not exist anywhere else."]);

extendPassage('batik',"Today, batik is made in many forms. Some designers combine traditional motifs with modern clothing styles, and printed fabrics that imitate batik patterns are sold cheaply in markets. Many craftspeople argue that these printed fabrics should not be called batik at all, because no wax is used in making them. To help buyers tell the difference, the Indonesian government has created a special label for genuine hand-drawn and stamped batik.");
extendPassage('sleep',"Sleep also affects physical health. During sleep, the body repairs tissues and releases hormones that control growth and appetite. People who regularly sleep less than six hours a night are more likely to catch colds, perhaps because their immune systems are weaker. Teenagers face a special challenge, since their internal clocks naturally shift later during adolescence, making it difficult for them to fall asleep early even when they have to wake up for school.");
addPassage('dustbowl','The Dust Bowl',[
 "During the 1930s, a series of severe dust storms struck the southern Great Plains of the United States, a region that includes parts of Kansas, Oklahoma, Texas, Colorado, and New Mexico. The storms were so large that they sometimes darkened the sky for days. On April 14, 1935, a day later known as Black Sunday, a huge wall of dust swept across the plains, turning the afternoon as dark as night. The affected area came to be called the Dust Bowl.",
 "The disaster was caused by a combination of human activity and nature. In the early twentieth century, high wheat prices and new machines such as tractors encouraged farmers to plow millions of acres of native grassland. The deep roots of these grasses had held the soil in place for thousands of years. When a long drought began in the early 1930s, the crops died, and nothing remained to protect the dry, loose soil from the strong winds of the plains.",
 "The Dust Bowl forced hundreds of thousands of people to leave their farms. Many traveled west to California in search of work, a journey described in John Steinbeck's novel The Grapes of Wrath. In response to the crisis, the federal government created the Soil Conservation Service in 1935. It taught farmers methods such as planting rows of trees to block the wind and rotating crops to keep the soil healthy. These practices are still used today."]);
addPassage('wayang','Wayang Kulit',[
 "Wayang kulit, the shadow puppet theater of Java and Bali, is one of the oldest storytelling traditions in Southeast Asia. The puppets are flat figures carved from buffalo hide and painted in great detail, with movable arms controlled by thin sticks. During a performance, the puppets are held between an oil lamp or electric light and a white cotton screen. Audience members may watch the moving shadows from one side of the screen or the colorful puppets themselves from the other.",
 "The central figure of every performance is the dalang, or puppet master. Sitting behind the screen, the dalang moves all of the puppets, speaks the voices of dozens of characters, and signals to the gamelan orchestra that accompanies the show. Traditional performances often last all night, from about nine in the evening until dawn. A skilled dalang must therefore have great physical endurance, a strong voice, and a deep knowledge of the stories, which are mostly drawn from the Indian epics the Ramayana and the Mahabharata.",
 "Although the stories are ancient, wayang has always responded to its audience. Dalang often include jokes about current events, and comic characters known as the punakawan, such as Semar and his sons, comment on the action and give advice to the heroes. In 2003, UNESCO recognized wayang as a Masterpiece of the Oral and Intangible Heritage of Humanity."]);
addPassage('tides','Tides',[
 "Anyone who spends a day at the beach will notice that the level of the sea rises and falls. These regular changes are called tides. In most places, there are two high tides and two low tides about every twenty-four hours and fifty minutes. The main cause of tides is the gravitational pull of the Moon. Because the side of the Earth facing the Moon is closer to it, the ocean water on that side is pulled toward the Moon slightly more strongly than the Earth itself, creating a bulge of water. A second bulge forms on the opposite side of the Earth. As the Earth rotates, a coastline passes through both bulges, producing two high tides.",
 "The Sun also affects the tides, although its influence is less than half that of the Moon because it is so much farther away. When the Sun, the Moon, and the Earth are lined up, as they are during a new moon and a full moon, their forces combine to produce especially high and low tides, called spring tides. The name has nothing to do with the season; it comes from the idea of the water \"springing up.\" When the Sun and Moon are at right angles to each other, their effects partly cancel out, producing smaller tides known as neap tides.",
 "The shape of the coastline also matters. In narrow bays, tidal water can pile up to great heights. The Bay of Fundy in Canada has the highest tides in the world, with a difference of up to 16 meters between high and low tide. People have long used tides for fishing and transportation, and today some countries are building power stations that generate electricity from the movement of tidal water."]);

LG('p3b1','B','Listen to a conversation between a student and a librarian.',[
 "M:Hi, I'm looking for a book called The History of Rice Farming in Asia, but the computer says it's not in this library.",
 "W:Let me check. You're right, we don't own a copy. But we can borrow it for you from another university through our interlibrary loan service.",
 "M:How long does that usually take?",
 "W:Normally about a week. If the book is coming from a library in another city, it might take ten days.",
 "M:My paper is due in two weeks, so that should be fine. Is there a fee?",
 "W:No, it's free for students. You just need to fill out this form and show your student ID. We'll send you an email when the book arrives.",
 "M:Great. Can I keep it for a whole month?",
 "W:Usually the lending library allows three weeks, so please return it on time."]);
LG('p3b2','B','Listen to a conversation between two students.',[
 "W:Hey, Tom. Are you still volunteering at the elementary school on Saturdays?",
 "M:Yes, I teach English to fourth graders there. Why do you ask?",
 "W:I want to get some teaching experience. I'm thinking of becoming a teacher after I graduate.",
 "M:You'd be great at it. The program always needs more volunteers, especially people who can teach science.",
 "W:Science? That's my major. What do I need to do to join?",
 "M:First you go to an orientation session. The next one is this Thursday at four o'clock in the student union. After that, you observe a class for one Saturday before you teach on your own.",
 "W:Thursday at four. I have a lab until three thirty, but I can make it.",
 "M:Perfect. I'll tell the coordinator you're coming."]);
LG('p3c1','C','Listen to part of a lecture in an engineering class.',[
 "M:Today let's look at the Brooklyn Bridge in New York, which opened in 1883. At the time, it was the longest suspension bridge in the world. The bridge was designed by John Roebling, but he never saw it built. Just before construction began in 1869, his foot was crushed in an accident at the site, and he died a few weeks later. His son, Washington Roebling, became the chief engineer. A few years later, Washington became seriously ill after working in the deep underwater chambers used to build the bridge's foundations. Unable to visit the site, he watched the work through a telescope from his apartment. His wife, Emily Roebling, carried his instructions to the workers. She learned so much about engineering that she became an essential part of the project, and when the bridge opened, she was the first person to cross it."]);
LG('p3c2','C','Listen to part of a lecture in a food science class.',[
 "W:Today we'll look at an example of fermentation that comes from Indonesia: tempeh. Tempeh is made from soybeans that are soaked, partly cooked, and then mixed with a mold called Rhizopus. Over one to two days, at a warm temperature, the mold grows white threads that spread through the beans and bind them into a firm cake. Fermentation does more than hold the beans together. The mold breaks down some of the proteins and other compounds in the soybeans, which makes tempeh easier to digest than plain soybeans. Tempeh is also an excellent source of protein, which is one reason it has become popular with vegetarians in many countries. Historians believe tempeh was being made in Java at least two hundred years ago, and it is still produced today in thousands of small home workshops."]);

extendPassage('rafflesia',"Rafflesia flowers are also difficult to study. Their buds take many months to develop, but many of them die before opening, and the plant cannot easily be grown in gardens or laboratories. For this reason, scientists still know little about how its seeds are spread. Some researchers believe that small animals, such as tree shrews, eat the fruit and carry the seeds to new vines. In Indonesia, Rafflesia arnoldii is one of three national flowers and a popular symbol of the country's rare wildlife.");
extendPassage('krakatau',"Today, Anak Krakatau is closely watched by scientists. In December 2018, part of the volcano collapsed into the sea during an eruption, causing a tsunami that struck the coasts of Banten and Lampung without warning and killed more than four hundred people. Because the waves were not produced by an earthquake, the existing warning systems did not detect them. Since then, Indonesia has worked to add instruments that can detect landslides and sudden changes in sea level.");
addPassage('bamboo','Bamboo',[
 "Bamboo is often mistaken for a tree, but it is actually a giant grass. There are more than 1,400 species, growing in climates as different as tropical rainforests and cool mountain slopes. Some species are among the fastest-growing plants on Earth; certain types can grow nearly a meter in a single day. Unlike trees, which grow wider each year, a bamboo stem, called a culm, reaches its full height and width within a few months and then spends the next several years becoming harder and stronger.",
 "These qualities make bamboo a valuable building material. Its strength compared with its weight is similar to that of some types of steel, and its hollow, jointed structure allows it to bend in strong winds without breaking. In Indonesia, bamboo has long been used for houses, bridges, and musical instruments such as the angklung of West Java. Because a bamboo plant sends up new culms from its underground stems after the old ones are cut, it can be harvested again and again without replanting.",
 "Bamboo does have weaknesses, however. Untreated bamboo is easily attacked by insects and fungi, and it can rot quickly when it stays wet. Traditional builders often soaked culms in water or smoked them over fires to protect them. Today, architects in Bali and elsewhere treat bamboo with natural salts called borates, allowing them to build large, modern structures that can last for decades."]);
addPassage('penguin','The Emperor Penguin',[
 "The emperor penguin is the largest of all penguin species, standing more than one meter tall and weighing up to 40 kilograms. It is also the only penguin that breeds on the sea ice of Antarctica during the winter, when temperatures can fall below minus 40 degrees Celsius and winds can blow at more than 140 kilometers per hour.",
 "Breeding begins in autumn, when thousands of penguins walk as far as 100 kilometers from the edge of the ocean to their traditional colonies. After the female lays a single egg, she carefully passes it to the male and then returns to the sea to feed. For about two months, the male balances the egg on his feet, covering it with a warm fold of skin called a brood pouch. During this time, he eats nothing. To survive the storms, the males huddle together in tight groups of hundreds or even thousands of birds, slowly taking turns moving from the cold outer edge to the warm center.",
 "By the time the chick hatches, the male may have lost nearly half of his body weight. If the female has not yet returned, he can feed the chick a milky substance produced in his throat. When she arrives, the parents take turns traveling to the sea for food. Scientists are concerned about the future of the species, because emperor penguins depend on stable sea ice, which is decreasing in some areas as the climate warms."]);
addPassage('railroad','The Transcontinental Railroad',[
 "Before the 1860s, traveling from the eastern United States to California was a long and dangerous journey. Settlers could spend four to six months crossing the continent in wagons, or they could take a ship around the southern tip of South America. In 1862, the United States Congress passed the Pacific Railway Act, which supported the construction of a railroad that would connect the existing railroads of the East with the Pacific coast.",
 "Two companies shared the task. The Central Pacific Railroad built eastward from Sacramento, California, while the Union Pacific Railroad built westward from Omaha, Nebraska. The Central Pacific faced the greatest physical challenge: cutting through the granite of the Sierra Nevada mountains. Most of its workers were immigrants from China, who carried out much of the dangerous work of blasting tunnels through solid rock. The Union Pacific, which crossed the flatter Great Plains, relied heavily on Irish immigrants and former soldiers from the Civil War.",
 "On May 10, 1869, the two lines finally met at Promontory Summit in Utah, where a ceremonial golden spike was driven into the last railroad tie. The journey across the country now took about a week. The railroad helped settlers move west and allowed goods to be shipped quickly between the coasts, but it also brought great hardship to Native American peoples, whose lands and buffalo herds were disrupted by the arrival of the trains and the settlers who followed."]);

LG('p4b1','B','Listen to a conversation between two students.',[
 "W:Guess what? I got the summer internship at the Morning Herald.",
 "M:That's fantastic! Isn't that the newspaper that only accepts five students a year?",
 "W:Yes, I still can't believe it. I'll be working in the science section, writing short articles about new research.",
 "M:That's perfect for you, since you're majoring in biology and you love writing. Is it paid?",
 "W:Not much. They pay a small amount for transportation, but that's it. I'll have to keep my weekend job at the bookstore to cover my rent.",
 "M:Working seven days a week sounds exhausting.",
 "W:It's only for ten weeks, and the experience will help me get a job as a science writer after I graduate."]);
LG('p4b2','B','Listen to a conversation between a student and a professor.',[
 "M:Professor Lopez, I'm having trouble choosing a topic for my urban planning paper.",
 "W:What are you interested in, Daniel?",
 "M:Transportation, I guess. My hometown has terrible traffic, especially during the morning rush hour.",
 "W:That's a good start, but traffic is a very broad subject. You need to narrow it down. For example, you could study whether the new bus lanes in your hometown have reduced travel times.",
 "M:That's interesting. They opened the bus lanes about two years ago, and I know the city publishes travel time data every year.",
 "W:Then you already have your data source. Compare the numbers from before and after the bus lanes opened. And talk to the reference librarian. She can help you find articles on bus lanes in other cities.",
 "M:Thanks. I'll go see her this afternoon."]);
LG('p4c1','C','Listen to part of a lecture in a history of science class.',[
 "W:Most people remember Florence Nightingale as a nurse, but she was also a pioneer in using statistics. During the Crimean War in the 1850s, she worked in a British military hospital in Turkey, where conditions were terrible. She kept careful records and discovered that far more soldiers were dying from diseases such as cholera and typhus than from their battle wounds. Many of these deaths were caused by dirty water, poor food, and crowded rooms. To convince government officials to make changes, she created a new kind of chart, now often called a rose diagram, which showed the causes of death month by month in colored sections. The diagram was easy to understand even for people who didn't like numbers. Her work led to major improvements in hospital cleanliness, and she later became the first woman elected to the Royal Statistical Society."]);
LG('p4c2','C','Listen to part of a lecture in a geology class.',[
 "M:Indonesia lies on what geologists call the Pacific Ring of Fire, a horseshoe-shaped zone about forty thousand kilometers long that circles the Pacific Ocean. About seventy-five percent of the world's active volcanoes are located along this ring, and roughly ninety percent of the world's earthquakes happen here. The reason is plate tectonics. The Earth's outer layer is broken into huge pieces called plates, which move very slowly, only a few centimeters a year, about as fast as your fingernails grow. Along the Ring of Fire, many of these plates collide. When an ocean plate slides beneath another plate, a process called subduction, rock deep underground melts and rises to form volcanoes. The movement also builds up stress, which is suddenly released as an earthquake. That's why countries such as Japan, Chile, and Indonesia experience so much volcanic activity."]);

extendPassage('orangutan',"Scientists have also discovered that orangutans are highly intelligent. Some populations use sticks to pull seeds out of fruit or to catch insects, and these skills are passed from mothers to their young, much like human traditions. In 2017, researchers described a third species, the Tapanuli orangutan, found only in a small area of forest in North Sumatra. With fewer than 800 individuals, it is the rarest great ape in the world.");
extendPassage('gardencity',"Not all of Howard's ideas worked as he had hoped. Because land and houses in Letchworth were relatively expensive, many of the poor factory workers he wanted to help could not afford to live there. Nevertheless, the idea of surrounding cities with protected green belts spread widely. After the Second World War, Britain built more than twenty new towns, and planners in other countries borrowed elements of the garden city, including in the design of the Kebayoran Baru district of Jakarta in the late 1940s.");
addPassage('komodo','The Komodo Dragon',[
 "The Komodo dragon is the largest living lizard in the world. Adults can grow up to three meters long and weigh more than 70 kilograms. The species lives only on a few islands in eastern Indonesia, including Komodo, Rinca, and Flores. Scientists believe that the ancestors of these lizards may have reached the islands millions of years ago, and that their large size helped them become the top predators in an environment with no large meat-eating mammals.",
 "Komodo dragons are patient hunters. A dragon may lie hidden in tall grass for hours, waiting for a deer, a wild pig, or even a water buffalo to pass by. When it attacks, it uses its sharp, curved teeth to cause deep wounds. For many years, people believed that dangerous bacteria in the dragon's mouth killed its prey. More recent research, however, has shown that the dragon has glands in its lower jaw that produce venom, which prevents blood from clotting and causes the prey to weaken quickly. Even if the animal escapes, the dragon can follow it for kilometers using its excellent sense of smell, detecting the scent with its long, forked tongue.",
 "Female Komodo dragons are also capable of a rare form of reproduction called parthenogenesis. In zoos, females kept apart from males have laid eggs that hatched into healthy young. This ability may help the species survive when a single female reaches a new island. In 1980, Komodo National Park was established to protect the dragons and their habitat, and in 1991 it was named a UNESCO World Heritage Site."]);
addPassage('paper','The Spread of Paper',[
 "Paper is so common today that it is easy to forget how important its invention was. Before paper, people wrote on materials such as clay, animal skins, silk, and strips of bamboo. Each of these had disadvantages: clay was heavy, animal skins took a long time to prepare, silk was costly, and bamboo strips were bulky. According to tradition, a Chinese court official named Cai Lun improved the process of making paper around the year 105. He mixed tree bark, old fishing nets, rags, and hemp, soaked them in water, beat them into a pulp, and spread the pulp on a screen to dry into thin sheets.",
 "For several centuries, the Chinese kept the method of papermaking largely to themselves. The knowledge gradually spread to Korea and Japan, and in the eighth century it reached the Islamic world. According to one story, Chinese papermakers captured after the Battle of Talas in 751 taught their skills in the city of Samarkand. Soon, cities such as Baghdad had busy paper mills, and paper helped scholars copy and share books on mathematics, medicine, and astronomy.",
 "Paper did not become common in Europe until several centuries later, when the first European paper mills were established in Spain and Italy. Its arrival came at an important time. When Johannes Gutenberg developed his printing press in the fifteenth century, a cheap and plentiful supply of paper made it possible to produce books in large numbers."]);
addPassage('jakarta','A Sinking City',[
 "Jakarta, a city of more than ten million people, is sinking faster than almost any other large city in the world. In some parts of North Jakarta, the ground has dropped by as much as 25 centimeters in a single year, and large areas of the city now lie below sea level. During heavy rains or high tides, seawater and river water can flood neighborhoods that were once dry, damaging homes and roads.",
 "The main cause of the problem is the pumping of groundwater. Because the city's piped water network does not reach many households and businesses, millions of people rely on wells that draw water from underground layers of sand and clay called aquifers. As the water is removed, the layers become compressed, and the land above them sinks. The weight of the city's many tall buildings adds further pressure. Unlike some other environmental changes, this sinking cannot be reversed: once the clay layers have been compressed, they do not expand again.",
 "The government has responded in several ways. Officials have built higher sea walls along the coast and have begun to limit the use of deep wells in some areas. Planners argue, however, that walls alone are not enough. The long-term solution, they say, is to expand the piped water supply so that people no longer need to pump groundwater. Meanwhile, the decision to build a new national capital, Nusantara, on the island of Borneo was partly motivated by the challenges facing Jakarta."]);

LG('p5b1','B','Listen to a conversation between two students.',[
 "M:Hi, Rina. Have you had a chance to look at the outline for our group presentation?",
 "W:Yes, I read it last night. I think we have too many topics. We only have fifteen minutes, and we're trying to cover the history, the economics, and the environmental effects of palm oil.",
 "M:You're right. What do you suggest?",
 "W:Let's focus on the environmental effects. That's what the professor emphasized in class, and there's a lot of recent research we can use.",
 "M:Good idea. I can make the slides if you write the script.",
 "W:Deal. And let's practice together on Thursday so we can check the timing.",
 "M:Thursday's fine. How about the small study room on the third floor of the library?",
 "W:Perfect. I'll reserve it today."]);
LG('p5b2','B','Listen to a conversation between a student and a career counselor.',[
 "M:Hi. I'm applying for a part-time job at a design company, and I'd like someone to look at my resume.",
 "W:Sure. Let me see. Well, the first thing I notice is that it's three pages long. For a student, one page is usually best.",
 "M:Really? I wanted to include everything I've done.",
 "W:Employers often spend less than a minute looking at each resume, so you need to choose what's most relevant. Since this is a design job, put your design projects and software skills at the top.",
 "M:What about my job at the restaurant? It isn't related to design.",
 "W:Keep it, but describe it briefly. It shows that you're responsible and can work in a team. And don't forget to include a link to your online portfolio.",
 "M:I don't have one yet.",
 "W:Then that should be your first step. Most design companies expect to see examples of your work."]);
LG('p5c1','C','Listen to part of a lecture in a world history class.',[
 "W:The Silk Road was not a single road but a network of trade routes that connected China with the Mediterranean world for more than fifteen hundred years. It got its name from Chinese silk, which was highly valued in Rome and other western cities. However, many other goods traveled along these routes, including spices, glass, paper, horses, and precious metals. Very few merchants traveled the entire distance. Instead, goods were passed from one trader to the next at markets and oasis towns along the way, so prices rose with each exchange. Perhaps the most important things carried on the Silk Road were not goods at all, but ideas. Religions such as Buddhism spread from India to China along these routes, and inventions such as papermaking moved west. The name Silk Road itself is quite recent. It was created by a German geographer, Ferdinand von Richthofen, in 1877."]);
LG('p5c2','C','Listen to part of a lecture in an environmental science class.',[
 "M:When we think of pollution, we usually think of dirty air or water. But today I'd like to talk about light pollution, which means too much artificial light at night, or light pointed in the wrong direction. Scientists estimate that about eighty percent of the world's population lives under skies that are polluted by artificial light, and in many cities people can no longer see the Milky Way. Light pollution affects wildlife as well. Newly hatched sea turtles, for example, find the ocean by moving toward the brightest horizon, which is normally the moonlit sea. Bright lights on beaches can confuse them, so they crawl inland instead. Many migrating birds that fly at night are also attracted to brightly lit buildings and may crash into them. The good news is that light pollution is easy to reduce. Using shields that point lights downward, turning off unnecessary lights, and choosing warmer-colored bulbs can make a big difference."]);

extendPassage('subak',"Today the subak system faces new pressures. As tourism grows, some rice fields are being sold and turned into hotels, villas, and restaurants, and young people are often more interested in jobs in the tourist industry than in farming. In addition, hotels and growing towns need large amounts of water, which can reduce the supply available to farmers downstream. Some villages have responded by developing agritourism, in which visitors pay to walk through the terraces and learn about traditional farming, providing farmers with extra income.");
extendPassage('gutenberg',"Not everyone welcomed the new technology. Some scribes worried about losing their jobs, and some religious and political leaders feared that printed books would spread ideas they could not control. Their fears were partly justified. In the early sixteenth century, the writings of the reformer Martin Luther were printed and distributed in huge numbers, helping his ideas spread across Europe within a few years. Printing also helped standardize spelling and grammar, since thousands of readers now saw the same words written in the same way.");
addPassage('otter','A Keystone Species',[
 "In ecology, a keystone species is a plant or animal that has an unusually large effect on its environment compared with its numbers. The term comes from architecture: in a stone arch, the keystone is the wedge-shaped stone at the top that holds all the other stones in place. If it is removed, the whole arch collapses. In the same way, removing a keystone species can cause great changes in an ecosystem.",
 "One of the best-known examples is the sea otter of the North Pacific coast. Sea otters eat large numbers of sea urchins, which in turn feed on kelp, a type of large seaweed that grows in underwater forests. During the eighteenth and nineteenth centuries, hunters killed hundreds of thousands of sea otters for their thick fur, and the animals nearly disappeared. Without otters to control them, sea urchin populations grew rapidly and ate the kelp forests down to bare rock. Fish and other animals that depended on the kelp for food and shelter declined as well.",
 "After an international agreement in 1911 protected sea otters, their numbers slowly recovered in many areas. Where otters returned, urchin numbers fell and kelp forests grew back, bringing fish and other wildlife with them. Researchers have also found that healthy kelp forests absorb carbon dioxide from the atmosphere, so the otters may even play a small role in slowing climate change."]);
addPassage('coffee','Coffee in Java',[
 "Coffee is one of the most widely traded agricultural products in the world, and Indonesia is among its largest producers. The plant is not native to the archipelago, however. Coffee originally came from the highlands of Ethiopia, and by the fifteenth century it was being grown and drunk in Yemen, on the Arabian Peninsula. For many years, Arab traders tried to keep control of the coffee trade by preventing living plants and fertile seeds from leaving the region.",
 "In the late seventeenth century, the Dutch East India Company succeeded in bringing coffee plants to Java. The first plants, brought in 1696, were destroyed by a flood, but a second shipment a few years later survived. The plantations grew so successfully that by the early eighteenth century Java was supplying a large share of the coffee sold in Europe, and the word \"java\" became a popular term for coffee in the English language. Under the colonial cultivation system of the nineteenth century, however, many Javanese farmers were forced to grow coffee and other export crops for the government, often at the expense of their own food crops.",
 "In the late nineteenth century, a plant disease called coffee leaf rust destroyed many of the arabica coffee trees in Java. Planters replaced many of them with robusta coffee, a hardier species that resists the disease and grows well at lower altitudes. Today, most of the coffee grown in Indonesia is robusta, although high-quality arabica from regions such as Aceh, North Sumatra, and Toraja is valued by coffee lovers around the world."]);
addPassage('elevator','The Safety Elevator',[
 "Tall buildings would be almost useless without elevators. Before the middle of the nineteenth century, few people wanted to live or work above the fifth or sixth floor, because climbing so many stairs every day was exhausting. Simple lifts powered by ropes and pulleys had existed for centuries, but people were afraid to ride them. If the rope broke, the platform would fall to the ground.",
 "In 1854, an American mechanic named Elisha Otis demonstrated a solution at an exhibition in New York. Standing on an open platform raised high above the crowd, he ordered the only rope holding it to be cut. Instead of falling, the platform dropped only a few centimeters before it stopped. Otis had invented a safety brake: a spring-operated device that automatically locked the platform to its guide rails if the rope lost tension. The demonstration helped convince the public that elevators could be safe, and in 1857 the first passenger elevator using his brake was installed in a store in New York City.",
 "The safety elevator, together with the development of strong steel frames, made it practical to build much taller buildings. By the early twentieth century, skyscrapers were rising in Chicago and New York. Elevator technology has continued to improve. Modern high-speed elevators can travel at more than 60 kilometers per hour, and some systems use computer programs to group passengers who are traveling to nearby floors, reducing waiting times."]);

/* ================= GABUNGKAN BANK SOAL ================= */
const Q=[];
(function(){
  const RANK={L:0,S:1,W:2,R:3};
  const part=q=>q.sec==='L'?(q.g?(LGROUPS[q.g].part==='B'?1:2):0):0;
  PACKS.forEach((P,pi)=>{
    P.items.forEach((q,k)=>{q.id=(pi+1)*100+k});            // ID lama tetap (riwayat soal salah aman)
    (EXTRA[pi]||[]).forEach((q,k)=>{q.id=(pi+1)*1000+k;P.items.push(q)});
    const first={};
    P.items.forEach((q,i)=>{q._i=i;const g=q.g||q.p;if(g&&first[g]===undefined)first[g]=i});
    const pos=q=>{const g=q.g||q.p;return g?first[g]:q._i};
    P.items.sort((x,y)=>RANK[x.sec]-RANK[y.sec]||part(x)-part(y)||pos(x)-pos(y)||x._i-y._i);
    P.items.forEach(q=>{q.pack=pi;Q.push(q)});
  });
})();

 L:{name:'Listening Comprehension',dir:'Dengarkan percakapan, lalu pilih jawaban terbaik. Teks audio baru ditampilkan setelah jawaban diperiksa.'},

function sset(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

const synth=('speechSynthesis' in window)?window.speechSynthesis:null;
let voices=[];
function loadVoices(){if(!synth)return;voices=synth.getVoices().filter(v=>/^en[-_]/i.test(v.lang))}
if(synth){loadVoices();synth.onvoiceschanged=loadVoices}
function pickVoice(who){
  if(!voices.length)return null;
  const us=voices.filter(v=>/en[-_]US/i.test(v.lang));const pool=us.length?us:voices;
  const fem=/female|zira|samantha|aria|jenny|susan|hazel|karen|victoria|libby|sonia|michelle|ava|allison/i;
  const mal=/\bmale|david|mark|guy|daniel|alex|george|ryan|fred|christopher|eric|tom/i;
  if(who==='W')return pool.find(v=>fem.test(v.name))||pool[0];
  if(who==='M')return pool.find(v=>mal.test(v.name)&&!/female/i.test(v.name))||pool[1]||pool[0];
  return pool.find(v=>/google/i.test(v.name))||pool[0];
}
/* Suara asli Android (WebView tidak punya speechSynthesis) */
const nativeTTS=window.AndroidTTS||null;
const hasTTS=!!(nativeTTS||synth);
let ttsSeq=0, ttsDone=null;
window.__ttsDone=function(id){if(id===String(ttsSeq)&&ttsDone){const f=ttsDone;ttsDone=null;f()}};
function speak(lines,onEnd){
  if(nativeTTS){
    const parts=[];
    lines.forEach(l=>l.t.split(/(?<=[.?!])\s+/).forEach(s=>parts.push({t:s,p:l.who==='W'?1.25:l.who==='M'?.85:1})));
    ttsSeq++;ttsDone=onEnd||null;
    nativeTTS.speakAll(JSON.stringify(parts),String(ttsSeq));
    return;
  }
  if(!synth){onEnd&&onEnd();return}
  synth.cancel();
  const parts=[];
  lines.forEach(l=>l.t.split(/(?<=[.?!])\s+/).forEach(s=>parts.push({who:l.who,t:s})));
  parts.forEach((p,i)=>{
    const u=new SpeechSynthesisUtterance(p.t);
    u.lang='en-US';const v=pickVoice(p.who);if(v)u.voice=v;
    u.rate=.95;u.pitch=p.who==='W'?1.25:p.who==='M'?.85:1;
    if(i===parts.length-1)u.onend=u.onerror=()=>onEnd&&onEnd();
    synth.speak(u);
  });
}
function stopAudio(){ttsDone=null;if(nativeTTS){try{nativeTTS.stop()}catch(e){}}else if(synth)synth.cancel()}
